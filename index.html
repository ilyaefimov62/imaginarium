<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧙 Имаджинариум</title>
  <style>
    :root {
      --bg: #12121f;
      --panel: #181830;
      --panel-2: #0f0f22;
      --panel-3: #1e1e3a;
      --accent: #f5c842;
      --accent-2: #ffe08a;
      --accent-soft: rgba(245,200,66,.16);
      --good: #2ecc71;
      --bad: #e74c3c;
      --info: #5aa9ff;
      --host: #8e6cff;
      --text: #eef0ff;
      --text-dim: #9aa0c0;
      --border: #2b2b52;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow: 0 16px 48px rgba(0,0,0,.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      /* Защита от случайного pull-to-refresh на мобильных браузерах:
         резкий свайп у верхнего/нижнего края экрана раньше перезагружал
         страницу и выкидывал игрока из комнаты. */
      overscroll-behavior-y: none;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% -10%, #21214a 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overscroll-behavior-y: none;
    }
    #app {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      width: 100%;
      animation: fadeUp .3s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .big-title {
      font-size: 2.4rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .big-sub {
      font-size: 1.5rem;
      font-weight: 500;
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .input-big {
      width: 100%;
      padding: 18px 24px;
      border-radius: 60px;
      border: 2px solid var(--border);
      background: var(--panel-3);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 500;
      outline: none;
      transition: .2s;
      text-align: center;
    }
    .input-big:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .btn {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #241b04;
      border: none;
      padding: 14px 24px;
      border-radius: 60px;
      font-size: 1.12rem;
      font-weight: 700;
      cursor: pointer;
      transition: .15s ease;
      box-shadow: 0 6px 20px rgba(245,200,66,.3);
      width: 100%;
      text-align: center;
      letter-spacing: 0.02em;
      line-height: 1.25;
    }
    .btn:hover { transform: scale(1.02); filter: brightness(1.05); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn-secondary {
      background: #2a2a4e;
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #33335f; }
    .btn-success {
      background: linear-gradient(180deg, #4ee08d, var(--good));
      color: #06210f;
    }
    .btn-danger {
      background: linear-gradient(180deg, #f0685a, var(--bad));
      color: #2a0805;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 2px dashed var(--border);
      box-shadow: none;
    }
    .btn-sm { padding: 12px 20px; font-size: 1rem; }
    .btn-block { width: 100%; }

    .row {
      display: flex;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }
    .row .btn { flex: 1; min-width: 140px; }

    .picker-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 8px 0;
    }
    .icon-option {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--panel-3);
      border: 4px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      transition: .15s;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .icon-option:hover { transform: scale(1.08); border-color: #454578; }
    .icon-option.selected {
      border-color: var(--accent);
      background: #2c2c58;
      box-shadow: 0 0 20px rgba(245,200,66,.4);
      transform: scale(1.05);
    }

    .color-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      border: 4px solid transparent;
      transition: .15s;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    .color-option:hover { transform: scale(1.14); }
    .color-option.selected {
      border-color: #fff;
      box-shadow: 0 0 0 4px var(--accent);
      transform: scale(1.1);
    }

    .room-code {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--panel-3);
      padding: 8px 24px;
      border-radius: 60px;
      border: 2px solid var(--border);
      letter-spacing: 0.1em;
    }
    .qr-container {
      background: #fff;
      padding: 12px;
      border-radius: 20px;
      line-height: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .players-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin: 8px 0;
    }
    .player-tag {
      background: var(--panel-3);
      padding: 8px 16px 8px 20px;
      border-radius: 60px;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid #666;
    }
    .player-tag .score-badge {
      background: #3a3a66;
      border-radius: 30px;
      padding: 2px 12px;
      font-size: 0.9rem;
    }
    .player-tag .remove-x {
      cursor: pointer;
      color: var(--text-dim);
      font-weight: 700;
      padding: 0 6px;
      border-radius: 50%;
      transition: .15s;
    }
    .player-tag .remove-x:hover { color: var(--bad); background: rgba(231,76,60,.15); }

    .game-container {
      max-width: 1020px;
      width: 100%;
      padding: 0;
    }
    .game-container .screen {
      max-width: 1020px;
      padding: 20px;
      gap: 16px;
    }
    .field-container {
      background: radial-gradient(circle at 50% 20%, #1c2140 0%, var(--panel-2) 80%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: none;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 200px;
      position: relative;
    }
    .field-container.visible {
      display: flex;
    }
    /* Ручной просмотр поля («🗺️ Игровое поле») открывается как отдельный
       полноэкранный просмотр — по аналогии с лупой у карт. */
    .field-container.overlay-mode {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      z-index: 1300;
      background: rgba(8,8,20,.92);
      border: none;
      border-radius: 0;
      padding: 20px;
    }
    #fieldCanvas {
      width: 100%;
      max-width: 520px;
      height: auto;
      aspect-ratio: 16/9;
      border-radius: 12px;
      display: block;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin: 8px 0;
    }
    .card {
      background: linear-gradient(160deg,#232350,#181834);
      border-radius: 12px;
      padding: 0;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      border: 3px solid transparent;
      transition: .15s;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      position: relative;
      overflow: hidden;
    }
    .card .emoji { font-size: 1.8rem; display:block; margin-bottom:3px; }
    .card .card-img { width:100%; height:auto; aspect-ratio: 229 / 343; object-fit:contain; background:#0b0b1c; border-radius:0; display:block; }

    /* Индикация состояния подгрузки картинки карты (см. watchCardImage/attemptImageLoad) */
    img.img-pending {
      background:
        linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.08) 50%, rgba(255,255,255,0) 70%) #14142c;
      background-size: 200% 100%;
      animation: imgShimmer 1.3s ease-in-out infinite;
      min-height: 60px;
    }
    @keyframes imgShimmer {
      0% { background-position: 150% 0; }
      100% { background-position: -50% 0; }
    }
    img.img-error {
      min-height: 60px;
      background: repeating-linear-gradient(135deg, #2a1414, #2a1414 10px, #3a1a1a 10px, #3a1a1a 20px);
      cursor: pointer;
      color: #ffb3b3;
      font-size: .75rem;
      text-align: center;
    }
    .card.selected { border-color: var(--accent); background:#2c2c58; transform:scale(1.04); }
    .card.played { opacity:.55; cursor:default; }
    .card.no-select { cursor:not-allowed; }
    .card.my-card { border-color:var(--good); background:#173a29; box-shadow:0 0 12px rgba(46,204,113,.35); }
    .card.leader-card { border-color:#f1c40f; box-shadow:0 0 16px rgba(241,196,15,.45); background:#332c17; }
    .card.mammoth-card { border-color:var(--bad); box-shadow:0 0 16px rgba(231,76,60,.4); background:#331a1a; }
    .card .my-label { font-size:.58rem; background:var(--good); color:#06210f; padding:1px 5px; border-radius:5px; margin-top:2px; font-weight:700; }
    .card .voter-icons { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; margin-top:4px; font-size:.6rem; }
    .card .voter-icons .voter { background:#3a3a66; border-radius:10px; padding:0 5px; color:#fff; font-size:.55rem; }
    .card .view-btn, .deck-tile .view-btn {
      position:absolute; top:4px; right:4px;
      background:rgba(0,0,0,.5); border-radius:50%; width:28px; height:28px;
      display:flex; align-items:center; justify-content:center;
      font-size:.8rem; color:#fff; border:none; cursor:pointer;
      transition:.15s;
    }
    .card .view-btn:hover, .deck-tile .view-btn:hover { background:rgba(245,200,66,.8); }

    .deck-tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin: 8px 0;
      text-align: center;
    }
    .deck-tile {
      position: relative;
      background: linear-gradient(160deg,#232350,#181834);
      border-radius: 14px;
      border: 3px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: .15s;
      box-shadow: 0 5px 10px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .deck-tile:hover { transform: scale(1.03); }
    .deck-tile img { width:100%; aspect-ratio: 1/1; object-fit:cover; display:block; background:#0b0b1c; }
    .deck-tile .deck-tile-label { padding:6px 4px 0; font-size:.85rem; font-weight:700; }
    .deck-tile .deck-tile-count { font-size:.65rem; color:var(--text-dim); padding:0 4px 6px; }
    .deck-tile.selected { border-color: var(--accent); background:#2c2c58; box-shadow: 0 0 16px rgba(245,200,66,.4); }

    @media (max-width: 600px) {
      .card-grid { gap: 8px; }
      .card { padding: 0; font-size:.9rem; }
      .card .emoji { font-size:1.6rem; }
    }

    .players-panel-horizontal {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      width: 100%;
    }
    .player-avatar {
      position:relative;
      width:56px; height:56px;
      border-radius:50%;
      border:3px solid transparent;
      background:var(--panel-3);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.18s;
      font-size:.65rem;
      color:var(--text-dim);
      text-align:center;
      padding:3px;
      flex-shrink:0;
    }
    .player-avatar .emoji-big { font-size:1.5rem; line-height:1; }
    .player-avatar .name { font-size:.55rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50px; }
    .player-avatar .score { font-size:.5rem; background:#3a3a66; border-radius:10px; padding:0 4px; margin-top:1px; }
    .player-avatar.active { border-color:var(--accent); background:#242452; transform:scale(1.06); box-shadow:0 0 14px rgba(245,200,66,.35); }
    .player-avatar.leader { border-color:#f1c40f; }
    .player-avatar.leader::before { content:'👑'; position:absolute; top:-9px; font-size:.8rem; }
    .player-avatar.bot { border-color:var(--host); opacity:.92; }
    .player-avatar.offline { opacity:.45; filter:grayscale(.6); }
    .player-avatar .offline-badge { position:absolute; bottom:-4px; right:-4px; font-size:.6rem; }
    .player-avatar.is-host::after { content:'H'; position:absolute; bottom:-4px; right:-2px; background:var(--host); color:#fff; font-size:.5rem; font-weight:700; border-radius:50%; width:13px; height:13px; line-height:13px; }
    .player-avatar .status-dot { position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; font-size:.5rem; display:flex; align-items:center; justify-content:center; background:var(--panel-2); border:1px solid var(--border); }
    .player-avatar .status-dot.done { background:var(--good); border-color:var(--good); color:#06210f; }
    .player-avatar .status-dot.pending { background:transparent; color:var(--text-dim); }
    .player-avatar .leave-x { position:absolute; bottom:-4px; left:-4px; width:15px; height:15px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); font-size:.5rem; line-height:13px; text-align:center; cursor:pointer; transition:.15s; }
    .player-avatar .leave-x:hover { background:var(--bad); color:#fff; border-color:var(--bad); }

    .info-text {
      margin:8px 0;
      text-align:center;
      color:var(--text-dim);
    }
    .info-text.warn { color:#ff9d9d; }
    .info-text.success { color:var(--good); }
    .action-btn { margin-top:10px; }
    .result-total { font-weight:800; color:var(--accent); font-size:1.15rem; margin-top:6px; }
    .round-summary { margin-top:10px; text-align:left; }
    .round-summary .rs-title { font-weight:700; color:var(--accent); font-size:1.15rem; margin-bottom:2px; text-align:center; }

    /* Единый стиль для объявлений/призывов к действию — как «Придумайте ассоциацию»:
       крупно, по центру, градиентная надпись, без коробки и боковой подсветки. */
    .announce {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 6px 0 12px;
      line-height: 1.3;
    }
    .announce.small { font-size: 1.15rem; margin-bottom: 8px; }

    /* Кнопки выбора — списком одна под другой */
    .stack-btns { display:flex; flex-direction:column; gap:10px; width:100%; margin-top:10px; }

    .hidden { display:none !important; }
    .footer-note { margin-top:20px; text-align:center; font-size:0.7rem; color:#565a80; }

    #toastContainer {
      position:fixed;
      left:0; right:0; bottom:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      z-index:999;
      pointer-events:none;
    }
    .toast {
      background:#20203f;
      border:1px solid var(--border);
      color:var(--text);
      padding:12px 24px;
      border-radius:60px;
      font-size:1rem;
      box-shadow:var(--shadow);
      opacity:0;
      transform:translateY(10px);
      transition:.25s;
      max-width:90vw;
      text-align:center;
      pointer-events:auto;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.info { border-color:var(--info); }
    .toast.success { border-color:var(--good); }
    .toast.warn { border-color:var(--bad); }

    .confirm-overlay {
      position:fixed; inset:0;
      background:rgba(8,8,20,.65);
      backdrop-filter:blur(2px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1200;
      padding:20px;
    }
    .overlay-close {
      position:absolute;
      top:16px; right:16px;
      background:rgba(0,0,0,.5);
      border:none;
      color:#fff;
      font-size:1.8rem;
      line-height:1;
      width:40px; height:40px;
      border-radius:50%;
      cursor:pointer;
      z-index:1201;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.15s;
    }
    .overlay-close:hover { background:rgba(245,200,66,.8); }
    .confirm-box {
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      padding:24px 28px;
      max-width:360px;
      width:100%;
      text-align:center;
    }
    .confirm-box p { font-size:1.1rem; line-height:1.5; margin-bottom:16px; }

    .deck-picker {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:6px 0 4px;
      max-height:48vh;
      overflow-y:auto;
      text-align:left;
    }
    .deck-option {
      display:flex;
      align-items:center;
      gap:10px;
      background:var(--panel-2);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:10px 12px;
      cursor:pointer;
      transition:.15s;
    }
    .deck-option.checked { border-color:var(--accent); background:var(--accent-soft); }
    .deck-option input[type="checkbox"] { width:18px; height:18px; flex-shrink:0; accent-color:var(--accent); }
    .deck-thumb { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
    .deck-option .deck-name { flex:1; font-weight:600; }
    .deck-count { color:var(--text-dim); font-size:.85rem; white-space:nowrap; }

    .card-viewer {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.92);
      z-index:2000;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      padding:16px;
      gap:10px;
    }
    .card-viewer.hidden { display:none; }
    .card-viewer .viewer-close {
      position:absolute;
      top:16px;
      right:16px;
      background:none;
      border:none;
      color:#fff;
      font-size:2.5rem;
      cursor:pointer;
      z-index:2001;
    }
    .card-viewer .viewer-content {
      flex:1;
      min-height:0;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .card-viewer .viewer-image {
      flex:1;
      min-height:0;
      width:100%;
      max-width:640px;
      background:var(--panel-3);
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 40px rgba(0,0,0,.8);
      font-size:4rem;
      text-align:center;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
    }
    .card-viewer .viewer-image img {
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .card-viewer .viewer-nav {
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:100%;
      max-width:640px;
      flex-shrink:0;
      gap:12px;
    }
    .card-viewer .viewer-nav button {
      background:rgba(255,255,255,.1);
      border:1px solid var(--border);
      color:#fff;
      padding:10px 24px;
      border-radius:30px;
      font-size:1.2rem;
      cursor:pointer;
      transition:.15s;
    }
    .card-viewer .viewer-nav button:hover { background:rgba(255,255,255,.2); }
    .card-viewer .viewer-counter {
      color:#fff;
      font-size:1.2rem;
      display:flex;
      align-items:center;
    }
  </style>
</head>
<body>
<div id="app">

  <div id="toastContainer"></div>

  <div id="confirmOverlay" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p id="confirmMessage">Вы уверены?</p>
      <div class="stack-btns">

<script>
(function(){
  'use strict';

  // ГЛОБАЛЬНЫЕ ЭЛЕМЕНТЫ

  // КОНФИГУРАЦИЯ
  const FIELD_SIZE = 33;
  const COLORS = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#e84393','#6c5ce7','#00cec9'];
  const AVATAR_ICONS = ['🐘','🦁','🐯','🦊','🐼','🐸','🦄','🐙','🦉','🐲'];

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCBFY6epFpgy2APbaBXw7wbDffCp-YoyTg",
    authDomain: "imaginarium-736bb.firebaseapp.com",
    databaseURL: "https://imaginarium-736bb-default-rtdb.firebaseio.com",
    projectId: "imaginarium-736bb",
    storageBucket: "imaginarium-736bb.firebasestorage.app",
    messagingSenderId: "333635031463",
    appId: "1:333635031463:web:29fee001c726450a00a682",
  };

  // Базовый адрес, откуда раздаются картинки карт (вынесено с Netlify на GitHub Pages,
  // чтобы не расходовать лимит трафика Netlify — см. переписку с пользователем).
  const CARDS_BASE_URL = 'https://ilyaefimov62.github.io/imaginarium-cards/cards';

  // Генератор колод с карточками-картинками: файлы лежат в cards/<papka>/001.png..NNN.png
  function makeImageDeck(id, name, folder, count, cover){
    const cards = [];
    for (let i = 1; i <= count; i++){
      const num = String(i).padStart(3, '0');
      cards.push({ img: `${CARDS_BASE_URL}/${folder}/${num}.png` });
    }
    return { id, name, cover: cover || `${CARDS_BASE_URL}/${folder}/cover.png`, cards };
  }

  const CARD_DECKS = [
    makeImageDeck('baza', 'База', 'baza', 98),
    makeImageDeck('new_year', 'New Year', 'new_year', 6),
    makeImageDeck('detstvo', 'Детство', 'detstvo', 98),
    makeImageDeck('x', 'X', 'x', 100),
    makeImageDeck('sumchatyy', 'Сумчатый', 'sumchatyy', 64),
    // Новые колоды будут добавляться сюда так же — одной строкой через makeImageDeck(...)
  ];
  CARD_DECKS.forEach(deck => {
    deck.cards.forEach((c, i) => { c.uid = deck.id + '#' + i; c.deckId = deck.id; });
  });

  function getDeckById(id){ return CARD_DECKS.find(d => d.id === id); }
  function totalCardsInDecks(deckIds){
    return (deckIds || []).reduce((sum, id) => { const d = getDeckById(id); return sum + (d ? d.cards.length : 0); }, 0);
  }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // ПРОФИЛЬ
  const PROFILE_KEY = 'imaginarium_profile_v1';
  let profile = {
    name: '',
    icon: AVATAR_ICONS[0],
    color: COLORS[0],
  };

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p.name) profile.name = p.name;

        if (p.color && COLORS.includes(p.color)) profile.color = p.color;

    } catch(e) {}
  }
  function saveProfile() {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch(e) {}
  }

  // УПРАВЛЕНИЕ ЭКРАНАМИ
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ИГРОВОЕ СОСТОЯНИЕ
  const HOST_ID = 'host';

  let G = {
    players: [],
    botPlayers: [],
    currentLeaderIndex: 0,
    turn: 0,
    phase: 'setup',
    association: '',
    associationInput: '',
    votes: {},
    votes2: {},
    leaderCardIndex: -1,
    playedCards: [],
    selectedCardIndex: -1,
    selectedCardForPlayer: {},
    selectedVoteForPlayer: {},
    selectedCards2: {},
    placedPlayers: [],
    leaderCard: null,
    mammothCard: null,

    myId: HOST_ID,
    isHost: true,
    isRoomHost: true,
    roomId: '—',
    gameMode: '4plus',
    gameStarted: false,
    gameOver: false,
    stopReason: '',
    awaitingContinueDecision: false,
    finishInfo: null,
    finishInfoPlayerId: null,
    pendingRawCommon: null,
    pendingRawMammoth: null,
    selectedDeckIds: [],
    awaitingDeckDecision: false,
    deckDecisionInfo: null,
    deckDecisionAfterAction: null,
    deckSwitchPickerOpen: false,
    pendingAdvanceMode2: false,
    playerPresence: {},

    mammothPosition: 0,
    commonSlonPosition: 0,

    activePlayerId: null,
    pawnAnim: {},
    pawnAnimLock: {},
    animCommon: { from:0, to:0, progress:1 },
    animMammoth: { from:0, to:0, progress:1 },
    deck: [],
    discard: [],
    lastResult: null,

    showField: false,
    fieldTimer: null,
  };

  function getPlayer(id){ return G.players.find(p => p.id === id); }
  function getActivePlayer(){ return getPlayer(G.activePlayerId); }
  function getLeader(){ return G.players[G.currentLeaderIndex] || null; }
  function isBotId(id){ return G.botPlayers.includes(id); }
  function getPlayerColor(id){ return getPlayer(id)?.color || '#fff'; }
  function colorName(name, color){ return `<span style="color:${color}; font-weight:700;">${escapeHtml(name)}</span>`; }
  function colorPlayerName(id){
    const p = getPlayer(id);
    return p ? colorName(p.name, p.color || '#fff') : '?';
  }
  function modeLabel(mode){
    return mode === '2' ? '2 игрока (кооп.)' : mode === '3' ? '3 игрока' : '4+ игроков';
  }
  function cardFaceHtml(card){
    if (!card) return '';
    if (card.img) return `<img class="card-img" src="${card.img}" alt="${escapeHtml(card.word || 'карта')}">`;
    return `<span class="emoji">${card.emoji}</span>${escapeHtml(card.word)}`;
  }

  // ===================================================================
  // НАДЁЖНАЯ ПОДГРУЗКА КАРТИНОК КАРТ
  // Проблема: на слабом Wi-Fi/мобильном интернете при показе сразу
  // много <img> (рука, разложенные карты, колода целиком) браузер
  // открывает десятки параллельных запросов, канал захлёбывается,
  // и часть картинок обрывается на середине загрузки и зависает так
  // навсегда. Решение ниже перехватывает КАЖДУЮ картинку карты
  // (независимо от того, где и как она отрисована), грузит их
  // ограниченными порциями, по таймауту перезапускает зависшую
  // загрузку и умеет докачивать по требованию пользователя.
  // ===================================================================
  const IMG_MAX_CONCURRENT = 4;   // не больше N одновременных загрузок
  const IMG_TIMEOUT_MS = 10000;   // если за это время не пришло — считаем зависшей
  const IMG_MAX_AUTO_ATTEMPTS = 4; // автоматических попыток на картинку

  let imgLoadQueue = [];
  let imgLoadActive = 0;

  function imgQueuePush(task){
    imgLoadQueue.push(task);
    imgQueuePump();
  }
  function imgQueuePump(){
    while (imgLoadActive < IMG_MAX_CONCURRENT && imgLoadQueue.length){
      const task = imgLoadQueue.shift();
      imgLoadActive++;
      task(() => { imgLoadActive--; imgQueuePump(); });
    }
  }

  // Картинки, которые уже успешно грузились в этой сессии — почти наверняка
  // лежат в кэше браузера. Без этой проверки каждая перерисовка экрана
  // (например, просто выбор карты) создаёт новые <img>-элементы с тем же
  // src, и наш менеджер загрузки на мгновение гасил src у уже готовой
  // картинки, отчего она мерцала «битой иконкой» при каждом действии.
  const loadedImageUrls = new Set();

  function attemptImageLoad(img, baseSrc, attempt, releaseSlot){
    let settled = false;
    // На повторных попытках добавляем параметр, чтобы не получить
    // из кэша/от сервера тот же оборванный полу-загруженный ответ.
    const url = attempt === 0 ? baseSrc : baseSrc + (baseSrc.indexOf('?') >= 0 ? '&' : '?') + '_retry=' + attempt;

    const timer = setTimeout(() => { finish(false); }, IMG_TIMEOUT_MS);

    function finish(ok){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      img.onload = null;
      img.onerror = null;
      if (ok){
        img.classList.remove('img-pending', 'img-error');
        loadedImageUrls.add(baseSrc);
        releaseSlot();
      } else if (attempt + 1 < IMG_MAX_AUTO_ATTEMPTS){
        img.removeAttribute('src');
        releaseSlot();
        imgQueuePush((rs) => attemptImageLoad(img, baseSrc, attempt + 1, rs));
      } else {
        img.classList.remove('img-pending');
        img.classList.add('img-error');
        img.dataset.origSrc = baseSrc;
        img.alt = '⟳ не загрузилось — нажмите';
        img.title = 'Не удалось загрузить картинку. Нажмите, чтобы повторить попытку.';
        releaseSlot();
      }
    }

    img.onload = () => finish(true);
    img.onerror = () => finish(false);
    img.src = url;
  }

  function watchCardImage(img){
    if (img.dataset.imgWatched) return;
    const src = img.getAttribute('src');
    if (!src) return;
    img.dataset.imgWatched = '1';
    if (loadedImageUrls.has(src)){
      // Уже грузили эту картинку раньше в этой сессии — не гасим src,
      // пусть браузер отдаст её мгновенно из своего кэша.
      return;
    }
    img.dataset.origSrc = src;
    img.removeAttribute('src');
    img.classList.add('img-pending');
    cardImgVisibilityObserver.observe(img);
  }

  const cardImgVisibilityObserver = ('IntersectionObserver' in window)
    ? new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting){
            cardImgVisibilityObserver.unobserve(entry.target);
            imgQueuePush((rs) => attemptImageLoad(entry.target, entry.target.dataset.origSrc, 0, rs));
          }
        });
      }, { root:null, rootMargin:'250px', threshold:0.01 })
    : { observe(img){ imgQueuePush((rs) => attemptImageLoad(img, img.dataset.origSrc, 0, rs)); } };

  function retryFailedImage(img){
    img.classList.remove('img-error');
    img.classList.add('img-pending');
    imgQueuePush((rs) => attemptImageLoad(img, img.dataset.origSrc, 0, rs));
  }

  function scanForCardImages(root){
    if (!root || !root.querySelectorAll) return;
    root.querySelectorAll('img.card-img, .deck-tile img, .viewer-image img').forEach(watchCardImage);
  }

  document.addEventListener('click', (e) => {
    const img = e.target.closest && e.target.closest('img.img-error');
    if (img) retryFailedImage(img);
  });

  const cardImgMutationObserver = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        if (node.matches && (node.matches('img.card-img') || node.matches('.deck-tile img') || node.matches('.viewer-image img'))){
          watchCardImage(node);
        }
        scanForCardImages(node);
      });
    });
  });
  cardImgMutationObserver.observe(document.getElementById('app'), { childList: true, subtree: true });
  scanForCardImages(document.getElementById('app'));

  // Функции работы с колодой
  function drawFromDeck(){
    // Важно: НЕ подмешиваем сброс автоматически. Пока в G.deck остаются
    // карты — раздаём только их. Если колода закончилась, возвращаем null:
    // это заставит ensureEnoughCards() показать игроку явный выбор
    // (закончить / доиграть этой же колодой / выбрать новую), а не тихо
    // подсунуть недавно сыгранные карты обратно без вопроса.
    if (G.deck.length === 0) return null;
    return G.deck.pop();
  }

  function dealAllPlayers(){
    G.players.forEach(p => {
      if (p.cards && p.cards.length){ G.discard.push(...p.cards.filter(Boolean)); p.cards = []; }
      p.cards = [];
    });
    // Раздаём по кругу (1-я карта всем, потом 2-я всем и т.д.), а не по 6 подряд
    // одному игроку — иначе при нехватке карт остатки старой колоды достаются
    // только первому в очереди, а остальным — уже совсем другой набор.
    for (let round = 0; round < 6; round++){
      G.players.forEach(p => {
        const c = drawFromDeck();
        if (c) p.cards.push(c);
      });
    }
  }

  function refillHand(p){
    while (p.cards.length < 6){
      const c = drawFromDeck();
      if (!c) break;
      p.cards.push(c);
    }
  }

  // Аналог refillHand, но для нескольких игроков сразу — добирает карты по
  // кругу (каждому по одной за раз), чтобы приоритетные (например, остатки
  // прежней колоды) карты доставались всем поровну, а не первому по списку.
  function refillHandsRoundRobin(players){
    let progress = true;
    while (progress){
      progress = false;
      for (const p of players){
        if (!p.cards) p.cards = [];
        if (p.cards.length < 6){
          const c = drawFromDeck();
          if (!c) return;
          p.cards.push(c);
          progress = true;
        }
      }
    }
  }

  function collectHeldCardUids(){
    const held = new Set();
    G.players.forEach(p => (p.cards||[]).forEach(c => { if (c && c.uid) held.add(c.uid); }));
    if (G.leaderCard && G.leaderCard.uid) held.add(G.leaderCard.uid);
    if (G.mammothCard && G.mammothCard.uid) held.add(G.mammothCard.uid);
    (G.playedCards||[]).forEach(item => { if (item.card && item.card.uid) held.add(item.card.uid); });
    return held;
  }
  function buildPoolFromDecks(deckIds, excludeUids){
    const pool = [];
    (deckIds||[]).forEach(id => {
      const deck = getDeckById(id);
      if (!deck) return;
      deck.cards.forEach(c => { if (!excludeUids.has(c.uid)) pool.push(c); });
    });
    return pool;
  }
  function calcNeededCards(){
    if (G.gameMode === '2') return G.players.length * 6 + 1; // полная пересдача рук + карта мамонта
    const refillNeeded = G.players.reduce((sum,p) => sum + Math.max(0, 6-(p.cards?p.cards.length:0)), 0);
    const modeExtra = G.gameMode === '3' ? 2 : 0;
    return refillNeeded + modeExtra;
  }
  function ensureEnoughCards(afterAction){
    const needed = calcNeededCards();
    // Сбрасом (уже сыгранными картами) НЕ считаем доступным запасом при решении,
    // раздавать ли карты молча — он идёт в дело только если игрок сам выберет
    // «доиграть этой же колодой». А вот для текста диалога и кнопки
    // «Продолжить этим набором» нужен запас колода + пригодный для повторной
    // раздачи сброс (только карты текущего выбора колод).
    const rawAvailable = G.deck.length;
    if (rawAvailable >= needed) return true;
    const selectedSet = new Set(G.selectedDeckIds);
    const recyclableDiscard = G.discard.filter(c => c && selectedSet.has(c.deckId)).length;
    G.awaitingDeckDecision = true;
    G.deckDecisionInfo = { needed, available: G.deck.length + recyclableDiscard };
    G.deckDecisionAfterAction = afterAction || 'advance';
    renderGame();
    return false;
  }

  // ===================================================================
  // ПОЛЕ (canvas)
  // ===================================================================
  const TRACK_TOTAL = FIELD_SIZE + 1;
  const TRACK_GRID = (() => {
    const pts = [];
    const push = (x,y) => pts.push([x,y]);
    for (let x=0; x<=6; x++) push(x,0);
    push(6,1); push(6,2);
    for (let x=7; x<=11; x++) push(x,2);
    for (let y=3; y<=6; y++) push(11,y);
    for (let x=10; x>=4; x--) push(x,6);
    push(4,5);
    for (let x=3; x>=0; x--) push(x,5);
    for (let y=4; y>=1; y--) push(0,y);
    return pts;
  })();

  let _trackCellsCache = null;
  function buildTrackCells(){
    const w = fieldCanvas.width, h = fieldCanvas.height;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    TRACK_GRID.forEach(([x,y]) => { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); });
    const w0 = maxX-minX, h0 = maxY-minY;
    const marginFrac = 0.09;
    const scalePx = Math.min((w*(1-2*marginFrac))/w0, (h*(1-2*marginFrac))/h0);
    const usedW = w0*scalePx, usedH = h0*scalePx;
    const offX = (w-usedW)/2, offY = (h-usedH)/2;
    return TRACK_GRID.map(([x,y]) => ({
      x: (offX + (x-minX)*scalePx) / w,
      y: (offY + (y-minY)*scalePx) / h,
    }));
  }
  function getTrackCells(){
    if (!_trackCellsCache) _trackCellsCache = buildTrackCells();
    return _trackCellsCache;
  }
  function getTrackPosition(index){
    const cells = getTrackCells();
    const n = cells.length;
    let idx = index % n;
    if (idx < 0) idx += n;
    const i0 = Math.floor(idx);
    const i1 = (i0+1) % n;
    const frac = idx - i0;
    const c0 = cells[i0], c1 = cells[i1];
    return { x: c0.x + (c1.x-c0.x)*frac, y: c0.y + (c1.y-c0.y)*frac };
  }
  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
  function drawCell(px, py, size, index, isFinish){
    const half = size/2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
    roundRectPath(ctx, px-half, py-half, size, size, size*0.24);
    const grad = ctx.createLinearGradient(px-half, py-half, px+half, py+half);
    if (isFinish){ grad.addColorStop(0,'#ffe9ad'); grad.addColorStop(1,'#f5c842'); }
    else if (index % 2 === 0){ grad.addColorStop(0,'#26264e'); grad.addColorStop(1,'#1a1a36'); }
    else { grad.addColorStop(0,'#2b2b5a'); grad.addColorStop(1,'#1e1e40'); }
    ctx.fillStyle = grad; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = isFinish ? '#fff3c4' : '#3c3c72';
    ctx.stroke();
    ctx.fillStyle = isFinish ? '#241c04' : '#9aa0c0';
    if (isFinish){
      ctx.font = Math.round(size*0.5) + 'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏁', px, py - size*0.12);
      ctx.font = 'bold ' + Math.round(size*0.26) + 'px sans-serif';
      // Финиш — это же клетка «0» (старт нового круга), а не свой порядковый
      // номер: иначе при игре на несколько кругов номер вида «33» сбивает с толку.
      ctx.fillText('0', px, py + size*0.29);
    } else {
      ctx.font = 'bold ' + Math.round(size*0.44) + 'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(index, px, py);
    }
    ctx.restore();
  }

  function drawPawn(px, py, r, emoji, bgColor, isHighlighted){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
    ctx.beginPath(); ctx.arc(px, py, r, 0, 2*Math.PI);
    ctx.fillStyle = bgColor || '#666';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = isHighlighted ? 2.5 : 1.5;
    ctx.strokeStyle = isHighlighted ? '#fff3c4' : 'rgba(255,255,255,.5)';
    ctx.stroke();
    ctx.font = Math.round(r*1.5) + 'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(emoji, px, py - r*0.02);
    ctx.restore();
  }

  function computeStackOffsets(items){
    const threshold = 0.35;
    const groups = [];
    items.forEach(item => {
      let g = groups.find(gr => Math.abs(gr.pos - item.pos) < threshold);
      if (!g){ g = { pos:item.pos, members:[] }; groups.push(g); }
      g.members.push(item);
    });
    const offsets = {};
    groups.forEach(g => {
      if (g.members.length === 1){ offsets[g.members[0].key] = { dx:0, dy:0, front:true }; return; }
      const rest = g.members.filter(m => !m.isMine);
      const mine = g.members.find(m => m.isMine);
      const count = Math.max(rest.length, 1);
      rest.forEach((m, i) => {
        const angle = -Math.PI/2 + (i + 0.5) * (2*Math.PI / count);
        offsets[m.key] = { dx: Math.cos(angle), dy: Math.sin(angle), front:false };
      });
      if (mine) offsets[mine.key] = { dx:0, dy:0, front:true };
      else if (rest.length) offsets[rest[rest.length-1].key].front = true;
    });
    return offsets;
  }

  function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

  let animRunning = false;
  function startAnimation(){
    if (animRunning) return;
    animRunning = true;
    (function loop(){ drawFieldAnimated(); requestAnimationFrame(loop); })();
  }

  function drawFieldAnimated(){
    const w = fieldCanvas.width, h = fieldCanvas.height;
    ctx.clearRect(0,0,w,h);

    if (!G.showField && !manualFieldView) {
      return;
    }

    const cells = getTrackCells();
    let minGap = Infinity;
    for (let i=0;i<cells.length;i++){
      const a = cells[i], b = cells[(i+1)%cells.length];
      const dx=(a.x-b.x)*w, dy=(a.y-b.y)*h;
      minGap = Math.min(minGap, Math.hypot(dx,dy));
    }
    const cellSize = minGap * 0.86;

    ctx.beginPath();
    cells.forEach((c,i) => { const px=c.x*w, py=c.y*h; i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py); });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(245,200,66,.16)';
    ctx.lineWidth = Math.max(6, cellSize*0.4);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();

    cells.forEach((c,i) => {
      drawCell(c.x*w, c.y*h, i===0 ? cellSize*1.22 : cellSize, i, i===0);
    });

    const rBase = cellSize*0.4;
    const offR = rBase*0.6;

    if (G.gameMode === '2'){
      let cPos = G.commonSlonPosition;
      if (G.animCommon.progress < 1){
        G.animCommon.progress = Math.min(1, G.animCommon.progress + 0.04);
        cPos = G.animCommon.from + (G.animCommon.to - G.animCommon.from) * easeInOut(G.animCommon.progress);
      } else cPos = G.animCommon.to;

      let mPos = G.mammothPosition;
      if (G.animMammoth.progress < 1){
        G.animMammoth.progress = Math.min(1, G.animMammoth.progress + 0.04);
        mPos = G.animMammoth.from + (G.animMammoth.to - G.animMammoth.from) * easeInOut(G.animMammoth.progress);
      } else mPos = G.animMammoth.to;

      const items = [
        { key:'mammoth', pos:mPos, isMine:false },
        { key:'slon', pos:cPos, isMine:true },
      ];
      const offsets = computeStackOffsets(items);

      const drawOne = (key, pos, emoji, bg, r) => {
        const off = offsets[key] || { dx:0, dy:0, front:true };
        const t = getTrackPosition(pos);
        const px = t.x*w + off.dx*offR, py = t.y*h + off.dy*offR - r*0.5;
        drawPawn(px, py, r, emoji, bg, off.front);
      };
      drawOne('mammoth', mPos, '🦣', '#7a2e2e', rBase*1.1);
      drawOne('slon', cPos, '🐘', '#f5c842', rBase);
    } else {
      const items = G.players.map(p => {
        let pos = p.position;
        const anim = G.pawnAnim[p.id];
        if (anim){
          if (anim.progress < 1){
            anim.progress = Math.min(1, anim.progress + 0.04);
            pos = anim.from + (anim.to-anim.from) * easeInOut(anim.progress);
          } else { pos = anim.to; delete G.pawnAnim[p.id]; }
        }
        return { key:p.id, pos, isMine: p.id === G.myId };
      });
      const offsets = computeStackOffsets(items);
      const order = items.slice().sort((a,b) => (a.isMine?1:0) - (b.isMine?1:0));
      order.forEach(item => {
        const p = getPlayer(item.key);
        const off = offsets[item.key] || { dx:0, dy:0, front:true };
        const t = getTrackPosition(item.pos);
        const px = t.x*w + off.dx*offR, py = t.y*h + off.dy*offR - rBase*0.5;
        const emoji = isBotId(item.key) ? '🐘' : (p?.avatar || '🐘');
        drawPawn(px, py, rBase, emoji, p?.color, item.isMine);
      });
    }
  }

  function isPawnLocked(key){
    return G.pawnAnimLock && G.pawnAnimLock[key] && Date.now() < G.pawnAnimLock[key];
  }
  // Считает «раскрученную вперёд» цель анимации: если новая (свёрнутая по
  // кругу 0..33) позиция численно МЕНЬШЕ прежней цели — значит, круг
  // завершился и нужно продолжать считать дальше по кругу, а не ехать
  // напрямую (что выглядело бы как разворот и путь через всё поле назад).
  // Движение фишек всегда только вперёд по часовой стрелке.
  function forwardAnimTarget(prevTo, newWrapped){
    let target = newWrapped;
    while (target < prevTo) target += TRACK_TOTAL;
    return target;
  }

  function updatePawnPositions(){
    if (G.gameMode === '2'){
      if (!isPawnLocked('__common')){
        const target = forwardAnimTarget(G.animCommon.to, G.commonSlonPosition);
        if (target !== G.animCommon.to){
          G.animCommon = { from:G.animCommon.to, to:target, progress:0 };
        }
      }
      if (!isPawnLocked('__mammoth')){
        const target = forwardAnimTarget(G.animMammoth.to, G.mammothPosition);
        if (target !== G.animMammoth.to){
          G.animMammoth = { from:G.animMammoth.to, to:target, progress:0 };
        }
      }
      return;
    }
    G.players.forEach(p => {
      if (isPawnLocked(p.id)){ p._prevPos = p.position; return; }
      const oldPos = p.position;
      if (!G.pawnAnim[p.id]){
        const prev = p._prevPos !== undefined ? p._prevPos : 0;
        const target = forwardAnimTarget(prev, oldPos);
        G.pawnAnim[p.id] = { from:prev, to:target, progress:0 };
      } else {
        const anim = G.pawnAnim[p.id];
        const target = forwardAnimTarget(anim.to, oldPos);
        if (anim.to !== target){
          const cur = anim.from + (anim.to-anim.from) * easeInOut(anim.progress);
          anim.from = cur; anim.to = target; anim.progress = 0;
        }
      }
      p._prevPos = oldPos;
    });
  }

  // ===================================================================
  // СЕТЬ (Firebase)
  // Скрипты Firebase/QRCode грузятся динамически, с таймаутом, а НЕ
  // обычными блокирующими <script src> тегами. Раньше, если эти внешние
  // домены были недоступны на текущей сети (например, без VPN), браузер
  // мог надолго зависнуть в ожидании их загрузки ещё ДО того, как
  // выполнится хоть одна строчка кода игры — из-за этого не работали
  // вообще никакие кнопки, включая локальную игру с ботами, которой
  // сеть не нужна. Теперь игра запускается сразу, а сеть подключается
  // в фоне и, если её нет, просто не появляется — без какого-либо блока.
  // ===================================================================
  let db = null, myUid = null, _myHand = [];
  let infoConnectedCallback = null;
  let activeListenerRefs = [];
  let netAvailable = false;

  // ВАЖНО: раньше грузили скрипт через <script src>. Если домен (Firebase/
  // QRCode CDN) заблокирован "тихо" — провайдер не рвёт соединение явной
  // ошибкой, а просто не отвечает (типичная блокировка без VPN) — то ни
  // onload, ни onerror у такого тега может не наступить вообще никогда.
  // Наш собственный таймер переставал ЖДАТЬ этот тег на уровне промиса, но
  // САМ браузер на сетевом уровне (а не только в DOM) мог по-прежнему
  // считать соединение "ещё устанавливается" сколько угодно долго — потому
  // что удаление/очистка <script>-тега не гарантированно обрывает уже
  // начатое TCP/TLS-соединение на всех мобильных браузерах и веб-вью. Из-за
  // этого индикатор загрузки страницы не доходил до конца, и часть
  // браузеров при этом ограничивала интерактивность страницы.
  //
  // Простой fetch() с AbortController тут не подходит напрямую: он
  // по-настоящему обрывает соединение при abort(), но gstatic.com (откуда
  // грузится Firebase SDK) не присылает заголовок Access-Control-Allow-
  // -Origin, поэтому fetch в режиме 'cors' будет падать с ошибкой CORS
  // даже при полностью исправной сети — это сломало бы игру всем, а не
  // только тем, у кого Firebase заблокирован.
  //
  // Поэтому делаем в два шага: сначала лёгкий HEAD-запрос в режиме
  // 'no-cors' — он не требует CORS-заголовков (мы не читаем ответ, только
  // проверяем сам факт соединения) и при этом по-настоящему прерывается
  // через AbortController.abort(), в отличие от <script>-тега. И только
  // если это подключение реально удалось — догружаем сам скрипт обычным
  // <script src>, который к этому моменту почти наверняка отработает быстро.
  function probeReachable(url, timeoutMs){
    return new Promise((resolve) => {
      let done = false;
      const controller = new AbortController();
      const timer = setTimeout(() => {
        if (!done){ done = true; controller.abort(); resolve(false); }
      }, timeoutMs);
      // Cache-busting параметр — чтобы проверочный запрос был отдельным от
      // последующей реальной загрузки скрипта и не путался с ней в кеше
      // браузера (на одном и том же URL иногда наблюдалась путаница между
      // HEAD-ответом проверки и GET-запросом самого скрипта).
      const probeUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + '_probe=' + Date.now();
      fetch(probeUrl, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: controller.signal })
        .then(() => { if (!done){ done = true; clearTimeout(timer); resolve(true); } })
        .catch(() => { if (!done){ done = true; clearTimeout(timer); resolve(false); } });
    });
  }

  function loadScriptWithTimeout(src, timeoutMs){
    return new Promise((resolve) => {
      probeReachable(src, timeoutMs).then((reachable) => {
        if (!reachable){ resolve(false); return; }
        let done = false;
        const el = document.createElement('script');
        // Страховочный таймаут на случай, если сам скрипт всё же не
        // загрузится быстро, даже когда HEAD-проверка прошла успешно.
        const safetyTimer = setTimeout(() => {
          if (!done){ done = true; el.onload = null; el.onerror = null; try{ el.src=''; el.remove(); }catch(e){} resolve(false); }
        }, 5000);
        el.onload = () => { if (!done){ done = true; clearTimeout(safetyTimer); resolve(true); } };
        el.onerror = () => { if (!done){ done = true; clearTimeout(safetyTimer); resolve(false); } };
        el.src = src;
        document.head.appendChild(el);
      });
    });
  }

  async function initFirebaseAsync(){
    try {
      const okApp = await loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js', 6000);
      if (!okApp) return;
      const [okAuth, okDb] = await Promise.all([
        loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js', 6000),
        loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js', 6000),
      ]);
      if (!okAuth || !okDb) return;
      if (typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('ВСТАВЬТЕ') === -1){
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database();
        netAvailable = true;
      }
    } catch(e){ console.error('[Imaginarium] Firebase init error:', e); netAvailable = false; }
  }
  // ВАЖНО: Firebase (и QR-код) раньше начинали грузиться сразу при открытии
  // страницы, ещё до того, как игрок хоть что-то нажал. Это означало, что
  // "Игра с ботами" тоже неявно зависела от того, доступен ли Firebase —
  // хотя ботам сеть вообще не нужна. Теперь загрузка Firebase запускается
  // ТОЛЬКО по требованию: при нажатии "Создать комнату" или "Зайти в
  // комнату" (см. ensureFirebaseInit ниже). Кнопка "Игра с ботами" эту
  // функцию не вызывает вообще — при её нажатии никаких сетевых обращений
  // не происходит.
  let firebaseReadyPromise = null;
  function ensureFirebaseInit(){
    if (!firebaseReadyPromise){
      firebaseReadyPromise = initFirebaseAsync();
      // QR-код нужен только когда реально создаём/открываем сетевую комнату —
      // грузим его тут же, заодно с Firebase, а не заранее.
      loadScriptWithTimeout('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 6000);
    }
    return firebaseReadyPromise;
  }

  function roomRef(code, path){ return db.ref('rooms/' + code + (path ? '/' + path : '')); }
  function ensureAuth(){
    return new Promise((resolve, reject) => {
      if (!netAvailable){ reject(new Error('Firebase не настроен')); return; }
      const cur = firebase.auth().currentUser;
      if (cur){ resolve(cur.uid); return; }
      const timer = setTimeout(() => reject(new Error('Вход занял слишком много времени')), 12000);
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)
        .catch(() => {})
        .then(() => firebase.auth().signInAnonymously())
        .then(cred => { clearTimeout(timer); resolve(cred.user.uid); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  // Иногда первое обращение к серверу (Firebase) на некоторых сетях/операторах
  // не проходит с первого раза (обрывается на установке соединения), хотя
  // сам сайт при этом открывается нормально. Повторные попытки почти всегда
  // помогают без необходимости включать VPN — поэтому оборачиваем создание
  // и подключение к комнате в несколько автоматических попыток.
  function withNetworkRetries(taskFn, opts){
    const attempts = (opts && opts.attempts) || 4;
    const baseDelayMs = (opts && opts.baseDelayMs) || 1200;
    const onAttempt = opts && opts.onAttempt;
    return new Promise((resolve, reject) => {
      let attempt = 0;
      function tryOnce(){
        attempt++;
        if (onAttempt) onAttempt(attempt, attempts);
        taskFn().then(resolve).catch(err => {
          if (attempt >= attempts){ reject(err); return; }
          setTimeout(tryOnce, baseDelayMs * attempt);
        });
      }
      tryOnce();
    });
  }

  let hostListenersAttached = false;
  function startHostNetworking(){
    // Ждём итога попытки загрузки Firebase (успех или таймаут), а не проверяем
    // netAvailable сразу — иначе можно ошибочно решить, что сети нет, только
    // потому что скрипты ещё не успели догрузиться в фоне. Firebase начинает
    // грузиться только сейчас, по факту вызова (см. ensureFirebaseInit) — а
    // не заранее при открытии страницы.
    ensureFirebaseInit().then(() => {
      if (!netAvailable){
        showOfflineRoomNote();
        return;
      }
      withNetworkRetries(() => ensureAuth().then((uid) => {
        myUid = uid;
        const code = randomRoomCode(5);
        G.roomId = code;
        return roomRef(code, 'state').set(buildPublicSnapshot()).then(() => code);
      }), {
        attempts: 4, baseDelayMs: 1200,
        onAttempt: (n, total) => { if (n === 2) toast('Подключаем мультиплеер... игру с ботами уже можно начинать', 'warn'); }
      }).then((code) => {
        updateRoomUI();
        renderRoomQr();
        attachHostListeners(code);
        infoConnectedCallback = (snap) => {
          if (snap.val() === true){
            const presenceRef = roomRef(code, 'hostOnline');
            presenceRef.onDisconnect().set(false);
            presenceRef.set(true);
          }
        };
        db.ref('.info/connected').on('value', infoConnectedCallback);
      }).catch((err) => {
        console.error('[Imaginarium] Firebase ошибка (хост):', err);
        showOfflineRoomNote();
      });
    });
  }

  // Комната и игра с ботами полностью доступны без сети — сеть нужна только
  // для приглашения других игроков по коду/QR. Если подключиться не удалось,
  // явно и без паники объясняем это прямо в комнате, а не просто ругаемся тостом.
  function showOfflineRoomNote(){
    document.getElementById('qrBlock').classList.add('hidden');
    const note = document.getElementById('offlineRoomNote');
    if (note) note.classList.remove('hidden');
    toast('Без подключения к интернету — но с ботами играть можно прямо сейчас.', 'warn');
  }

  function renderRoomQr(){
    if (typeof QRCode === 'undefined' || !roomQrEl) {
      console.warn('QRCode library not loaded or roomQrEl missing');
      return;
    }
    const url = buildJoinUrl(G.roomId);
    roomQrEl.innerHTML = '';
    try {
      new QRCode(roomQrEl, { text:url, width:150, height:150, colorDark:'#1a1a2e', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
      qrBlock.style.display = 'block';
    } catch(e){ console.warn('QR generation error:', e); }
  }
  function buildJoinUrl(code){
    if (location.protocol.indexOf('http') === 0){
      return location.origin + location.pathname + '?join=' + code;
    }
    return code;
  }

  function attachHostListeners(code){
    if (hostListenersAttached) return;
    hostListenersAttached = true;
    activeListenerRefs = [];

    const joinRef = roomRef(code, 'joinRequests');
    const joinCb = (snap) => {
      if (G.gameStarted){ snap.ref.remove(); return; }
      const req = snap.val();
      if (!req){ return; }
      addRealPlayer(snap.key, req.name, req.icon, req.color);
      syncPlayerNow(snap.key);
      broadcastState();
      snap.ref.remove();
    };
    joinRef.on('child_added', joinCb);
    activeListenerRefs.push({ ref:joinRef, event:'child_added', cb:joinCb });

    const actionsRef = roomRef(code, 'actions');
    const actionsCb = (snap) => {
      const entry = snap.val();
      if (entry && entry.playerId) applyRemoteAction(entry.playerId, entry.action, entry.data);
      snap.ref.remove();
    };
    actionsRef.on('child_added', actionsCb);
    activeListenerRefs.push({ ref:actionsRef, event:'child_added', cb:actionsCb });

    const presenceRef2 = roomRef(code, 'presence');
    const presenceCb = (snap) => {
      G.playerPresence = snap.val() || {};
      if (G.gameStarted) renderGame(); else updateRoomUI();
    };
    presenceRef2.on('value', presenceCb);
    activeListenerRefs.push({ ref:presenceRef2, event:'value', cb:presenceCb });
  }

  function addRealPlayer(id, name, icon, color){
    if (!id || getPlayer(id) || G.gameStarted) return;
    const idx = G.players.length;
    const p = {
      id,
      name: (name || 'Игрок').toString().trim().slice(0,12) || 'Игрок',
      score:0, cards:[], position:0,
      color: color || COLORS[idx % COLORS.length],
      avatar: icon || AVATAR_ICONS[idx % AVATAR_ICONS.length],
    };
    G.players.push(p);
    // Карты раздавать здесь не нужно: колода на этот момент может быть ещё
    // не выбрана (пустая) — тогда в руку попадут "пустые" значения вместо
    // карт, которые потом застрянут в сбросе. Руки всё равно полностью
    // пересдаются при старте игры (actuallyStartGame -> dealAllPlayers).
    updateRoomUI();
    toast(`${p.name} подключился к комнате`, 'success');
  }

  function buildPublicSnapshot(){
    return {
      players: G.players.map(p => ({
        id:p.id, name:p.name, score:p.score, position:p.position,
        color:p.color, avatar:p.avatar, cardCount:(p.cards||[]).length,
      })),
      botPlayers: G.botPlayers.slice(),
      currentLeaderIndex:G.currentLeaderIndex, turn:G.turn, phase:G.phase,
      association:G.association, votes:{...G.votes}, votes2:{...G.votes2},
      leaderCardIndex:G.leaderCardIndex, playedCards:G.playedCards.map(c=>({...c})),
      placedPlayers:G.placedPlayers.slice(), leaderCard:G.leaderCard, mammothCard:G.mammothCard,
      gameMode:G.gameMode, gameStarted:G.gameStarted, gameOver:G.gameOver, stopReason:G.stopReason,
      awaitingContinueDecision:G.awaitingContinueDecision, finishInfo:G.finishInfo, finishInfoPlayerId:G.finishInfoPlayerId,
      mammothPosition:G.mammothPosition, commonSlonPosition:G.commonSlonPosition,
      lastResult:G.lastResult, pendingRawCommon:G.pendingRawCommon, pendingRawMammoth:G.pendingRawMammoth,
      roomId:G.roomId,
      selectedDeckIds:(G.selectedDeckIds||[]).slice(),
      awaitingDeckDecision:G.awaitingDeckDecision, deckDecisionInfo:G.deckDecisionInfo,
      deckSwitchPickerOpen:G.deckSwitchPickerOpen,
      showField:G.showField,
    };
  }
  function broadcastState(){
    if (!G.isRoomHost || !netAvailable || !G.roomId || G.roomId === '—') return;
    roomRef(G.roomId, 'state').set(buildPublicSnapshot()).catch(e => console.error('[Imaginarium] ошибка синхронизации:', e));
  }
  function syncPlayerNow(playerId){
    if (!netAvailable || !G.roomId || G.roomId === '—') return;
    const p = getPlayer(playerId);
    roomRef(G.roomId, 'hands/' + playerId).set(p ? (p.cards||[]) : []).catch(e => console.error('[Imaginarium] ошибка синхронизации руки:', e));
  }
  function syncAllHands(){
    if (!G.isRoomHost) return;
    G.players.forEach(p => { if (p.id !== HOST_ID && !isBotId(p.id)) syncPlayerNow(p.id); });
  }

  function applyRemoteAction(playerId, action, data){
    data = data || {};
    const prevActive = G.activePlayerId;
    switch(action){
      case 'submitAssociation':
        G.activePlayerId = playerId; G.selectedCardIndex = data.cardIndex;
        Game.submitAssociation(data.association || '');
        break;
      case 'submitAssociation2':
        G.activePlayerId = playerId;
        Game.submitAssociation2(data.association || '');
        break;
      case 'submitCard':
        G.activePlayerId = playerId; G.selectedCardForPlayer[playerId] = data.cardIndex;
        Game.submitCard();
        break;
      case 'submitCards2':
        G.activePlayerId = playerId; G.selectedCards2[playerId] = (data.cardIndexes || []).slice();
        Game.submitCards2();
        break;
      case 'submitVote':
        G.activePlayerId = playerId; G.selectedVoteForPlayer[playerId] = data.cardIndex;
        Game.submitVote();
        break;
      case 'submitVote2':
        G.activePlayerId = playerId; G.selectedVoteForPlayer[playerId] = data.cardIndex;
        Game.submitVote2();
        break;
      case 'leave':
        G.activePlayerId = prevActive;
        removePlayer(playerId);
        return;
    }
    G.activePlayerId = prevActive;
  }

  let _hasJoinedRoom = false;
  let _joinWaitTimer = null;

  function connectToRoom(code, onDone){
    // Как и при создании комнаты — сначала дожидаемся итога попытки
    // загрузки Firebase, а не проверяем netAvailable сразу. Загрузка
    // Firebase запускается прямо здесь, по факту вызова.
    ensureFirebaseInit().then(() => {
      if (!netAvailable){ toast('Нет связи для подключения по коду — попробуйте ещё раз или проверьте интернет.', 'warn'); onDone && onDone(false); return; }
      withNetworkRetries(() => ensureAuth().then((uid) => {
      myUid = uid;
      return roomRef(code, 'state').once('value').then((snap) => {
        if (!snap.exists()){ toast('Комната с таким кодом не найдена', 'warn'); onDone && onDone(false); return; }
        const remoteState = snap.val();
        if (remoteState.gameStarted){ toast('Игра уже началась — подключение новых игроков закрыто', 'warn'); onDone && onDone(false); return; }
        G.myId = uid; G.isHost = false; G.isRoomHost = false; G.roomId = code;
        _hasJoinedRoom = false;
        return roomRef(code, 'joinRequests/' + uid).set({
          name: profile.name || 'Игрок', icon:profile.icon, color:profile.color, ts:Date.now(),
        }).then(() => {
          attachPlayerListeners(code, uid);
          if (_joinWaitTimer) clearTimeout(_joinWaitTimer);
          _joinWaitTimer = setTimeout(() => {
            if (!_hasJoinedRoom){
              toast('Хост не подтвердил подключение. Попробуйте ещё раз.', 'warn');
              stopNetworking();
              fullResetToLanding();
            }
          }, 10000);
          onDone && onDone(true);
        });
      });
    }), {
      attempts: 4, baseDelayMs: 1200,
      onAttempt: (n, total) => { if (n > 1) toast(`Не удалось подключиться, пробуем ещё раз (${n} из ${total})...`, 'warn'); }
    }).catch((err) => {
      console.error('[Imaginarium] Firebase ошибка (игрок):', err);
      toast('Не удалось подключиться после нескольких попыток: ' + (err && err.message || err), 'warn');
      onDone && onDone(false);
    });
    });
  }

  let playerListenersAttached = false;
  function attachPlayerListeners(code, uid){
    if (playerListenersAttached) return;
    playerListenersAttached = true;
    activeListenerRefs = [];

    const stateRef = roomRef(code, 'state');
    const stateCb = (snap) => {
      if (G.roomId !== code) return;
      const remote = snap.val();
      if (!remote){
        toast('Комната закрыта хостом', 'warn');
        stopNetworking();
        fullResetToLanding();
        return;
      }
      applyRemoteState(remote, _myHand);
    };
    stateRef.on('value', stateCb);
    activeListenerRefs.push({ ref:stateRef, event:'value', cb:stateCb });

    const handRef = roomRef(code, 'hands/' + uid);
    const handCb = (snap) => {
      if (G.roomId !== code) return;
      _myHand = snap.val() || [];
      const me = G.players.find(p => p.id === G.myId);
      if (me){
        me.cards = _myHand;
        if (G.gameStarted) renderGame(); else updateRoomUI();
      }
    };
    handRef.on('value', handCb);
    activeListenerRefs.push({ ref:handRef, event:'value', cb:handCb });

    const hostOnlineRef = roomRef(code, 'hostOnline');
    const hostOnlineCb = (snap) => {
      if (G.roomId !== code) return;
      if (snap.exists() && snap.val() === false) toast('Хост отключился от комнаты', 'warn');
    };
    hostOnlineRef.on('value', hostOnlineCb);
    activeListenerRefs.push({ ref:hostOnlineRef, event:'value', cb:hostOnlineCb });

    infoConnectedCallback = (snap) => {
      if (G.roomId !== code) return;
      if (snap.val() === true){
        const presenceRef = roomRef(code, 'presence/' + uid);
        presenceRef.onDisconnect().set('offline');
        presenceRef.set('online');
      }
    };
    db.ref('.info/connected').on('value', infoConnectedCallback);
  }

  function applyRemoteState(remote, myHand){
    const phaseChanged = G.phase !== remote.phase;
    const oldById = {}; G.players.forEach(p => { oldById[p.id] = p; });
    G.players = (remote.players || []).map(p => {
      const old = oldById[p.id];
      return { ...p, cards: p.id===G.myId ? (myHand||[]) : [], _prevPos: old ? old._prevPos : undefined };
    });
    G.botPlayers = remote.botPlayers || [];
    G.currentLeaderIndex = remote.currentLeaderIndex;
    G.turn = remote.turn;
    G.phase = remote.phase;
    G.association = remote.association;
    G.votes = remote.votes || {};
    G.votes2 = remote.votes2 || {};
    G.leaderCardIndex = remote.leaderCardIndex;
    G.playedCards = remote.playedCards || [];
    G.placedPlayers = remote.placedPlayers || [];
    G.leaderCard = remote.leaderCard;
    G.mammothCard = remote.mammothCard;
    G.gameMode = remote.gameMode;
    G.gameStarted = remote.gameStarted;
    G.gameOver = remote.gameOver;
    G.stopReason = remote.stopReason;
    G.awaitingContinueDecision = remote.awaitingContinueDecision;
    G.finishInfo = remote.finishInfo;
    G.finishInfoPlayerId = remote.finishInfoPlayerId;
    G.mammothPosition = remote.mammothPosition;
    G.commonSlonPosition = remote.commonSlonPosition;
    G.lastResult = remote.lastResult;
    G.pendingRawCommon = remote.pendingRawCommon;
    G.pendingRawMammoth = remote.pendingRawMammoth;
    G.roomId = remote.roomId || G.roomId;
    G.selectedDeckIds = remote.selectedDeckIds || G.selectedDeckIds;
    G.awaitingDeckDecision = remote.awaitingDeckDecision;
    G.deckDecisionInfo = remote.deckDecisionInfo;
    G.deckSwitchPickerOpen = remote.deckSwitchPickerOpen;
    G.showField = !!remote.showField;

    G.activePlayerId = G.myId;

    if (phaseChanged){
      G.selectedCardIndex = -1;
      G.selectedCardForPlayer = {};
      G.selectedVoteForPlayer = {};
      G.selectedCards2 = {};
      G.associationInput = '';
    }

    const amIPresent = G.players.some(p => p.id === G.myId);
    if (amIPresent){
      _hasJoinedRoom = true;
      if (_joinWaitTimer){ clearTimeout(_joinWaitTimer); _joinWaitTimer = null; }
    }

    if (!amIPresent){
      if (_hasJoinedRoom){
        toast('Вы больше не в этой игре', 'warn');
        stopNetworking();
        fullResetToLanding();
      }
      return;
    }

    if (G.gameStarted){ closeDeckLobbyBrowser(); closeDeckContentView(); showScreen('screenGame'); renderGame(); }
    else { showScreen('screenRoom'); updateRoomUI(); }
  }

  function closeRoomInFirebase(){
    if (netAvailable && db && G.roomId && G.roomId !== '—'){
      try { db.ref('rooms/'+G.roomId).remove(); } catch(e){}
    }
  }

  function stopNetworking(){
    activeListenerRefs.forEach(({ ref, event, cb }) => {
      try { ref.off(event, cb); } catch(e){}
    });
    activeListenerRefs = [];
    if (infoConnectedCallback){
      try { db.ref('.info/connected').off('value', infoConnectedCallback); } catch(e){}
      infoConnectedCallback = null;
    }
    if (netAvailable && db && myUid && G.roomId && G.roomId !== '—'){
      try { db.ref('rooms/'+G.roomId+'/presence/'+myUid).remove(); } catch(e){}
    }
    myUid = null;
    hostListenersAttached = false;
    playerListenersAttached = false;
  }

  function sendAction(type, data){
    if (!netAvailable || !myUid || !G.roomId || G.roomId === '—'){ toast('Нет соединения с хостом', 'warn'); return; }
    roomRef(G.roomId, 'actions').push({ playerId:myUid, action:type, data:data||{}, ts:Date.now() })
      .catch(e => { console.error('[Imaginarium] ошибка отправки действия:', e); toast('Не удалось отправить действие', 'warn'); });
  }

  // ===================================================================
  // УПРАВЛЕНИЕ КОМНАТОЙ
  // ===================================================================
  function createHostAndShowRoom(){
    const name = profile.name || 'Хост';
    G.myId = HOST_ID;
    G.isHost = true;
    G.isRoomHost = true;
    G.players = [{ id:HOST_ID, name, score:0, cards:[], position:0, color:profile.color, avatar:profile.icon }];
    G.botPlayers = [];
    G.activePlayerId = HOST_ID;
    G.gameStarted = false;
    G.deck = shuffle(buildPoolFromDecks(G.selectedDeckIds, new Set()));
    G.discard = [];
    G.pawnAnim = {};
    G.pawnAnimLock = {};
    G.animCommon = { from:0, to:0, progress:1 };
    G.animMammoth = { from:0, to:0, progress:1 };
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;
    showScreen('screenRoom');
    updateRoomUI();
  }

  function addBot(){
    if (!G.isRoomHost) return;
    if (G.gameStarted){ toast('Нельзя добавить игрока: игра уже началась.', 'warn'); return; }
    const idx = G.players.length;
    const botId = 'bot_' + Date.now() + '_' + idx;
    const color = COLORS[idx % COLORS.length];
    const bot = { id:botId, name:'Бот ' + (idx), score:0, cards:[], position:0, color, avatar:'🤖' };
    G.players.push(bot);
    G.botPlayers.push(botId);
    // Карты раздавать здесь не нужно (и вредно): колода на этот момент может
    // быть ещё не выбрана — тогда в руку попадут "пустые" значения вместо
    // карт вместо этого, а руки всё равно полностью пересдаются при старте
    // игры (actuallyStartGame -> dealAllPlayers).
    updateRoomUI();
    toast(`${bot.name} присоединился к комнате`, 'success');
  }

  function clearAllBots(){
    if (!G.isRoomHost) return;
    const bots = G.botPlayers.slice();
    bots.forEach(id => removePlayer(id, { silent:true }));
    if (bots.length) toast('Все боты удалены из комнаты', 'info');
    updateRoomUI();
  }

  function removePlayer(playerId, opts){
    opts = opts || {};
    const player = getPlayer(playerId);
    if (!player) return;

    G.playedCards = G.playedCards.filter(c => c.playerId !== playerId);
    G.placedPlayers = G.placedPlayers.filter(id => id !== playerId);
    delete G.votes[playerId];
    delete G.votes2[playerId];
    delete G.selectedCardForPlayer[playerId];
    delete G.selectedVoteForPlayer[playerId];
    delete G.selectedCards2[playerId];
    delete G.pawnAnim[playerId];
    if (player.cards && player.cards.length) G.discard.push(...player.cards.filter(Boolean));

    if (G.isRoomHost && netAvailable && !isBotId(playerId) && playerId !== HOST_ID && G.roomId && G.roomId !== '—'){
      try { db.ref('rooms/'+G.roomId+'/presence/'+playerId).remove(); } catch(e){}
      try { db.ref('rooms/'+G.roomId+'/hands/'+playerId).remove(); } catch(e){}
    }

    const wasLeader = getLeader()?.id === playerId;
    const leaderIdBefore = getLeader()?.id;

    G.players = G.players.filter(p => p.id !== playerId);
    G.botPlayers = G.botPlayers.filter(id => id !== playerId);

    if (leaderIdBefore && leaderIdBefore !== playerId){
      const idx = G.players.findIndex(p => p.id === leaderIdBefore);
      if (idx !== -1) G.currentLeaderIndex = idx;
    }

    if (G.activePlayerId === playerId){
      focusPlayer(G.players[0]?.id || HOST_ID);
    }

    if (!opts.silent) toast(`${player.name} покинул игру`, 'info');

    if (!G.gameStarted){
      updateRoomUI();
      return;
    }

    handlePlayerCountChangeMidGame(wasLeader);
  }

  function handlePlayerCountChangeMidGame(wasLeader){
    const count = G.players.length;
    const minRequired = G.gameMode === '2' ? 2 : 3;
    if (count < minRequired){
      G.gameOver = true;
      G.phase = 'stopped';
      G.stopReason = count <= 1
        ? 'Недостаточно игроков для продолжения.'
        : 'Осталось 2 игрока — режим для двоих использует другие правила, автоматически продолжить нельзя.';
      toast('Игра остановлена: ' + G.stopReason, 'warn');
      renderGame();
      return;
    }
    if (count === 3 && G.gameMode === '4plus'){
      G.gameMode = '3';
      toast('Остался 3 игрок — режим переключён на «3 игрока» (правила похожи).', 'info');
    }
    if (wasLeader && (G.phase === 'association' || G.phase === 'placing' || G.phase === 'voting')){
      toast('Ведущий покинул игру — раунд прерван, начинается новый ход.', 'warn');
      abortRoundAndAdvance();
      return;
    }
    renderGame();
  }

  function abortRoundAndAdvance(){
    G.playedCards.forEach(item => { if (item.card) G.discard.push(item.card); });
    if (G.leaderCard) G.discard.push(G.leaderCard);
    if (G.mammothCard) G.discard.push(G.mammothCard);
    G.playedCards = [];
    G.leaderCard = null;
    G.mammothCard = null;
    G.placedPlayers = [];
    G.votes = {}; G.votes2 = {};
    G.selectedCardForPlayer = {}; G.selectedVoteForPlayer = {}; G.selectedCards2 = {};
    G.leaderCardIndex = -1;
    G.association = ''; G.associationInput = '';
    G.selectedCardIndex = -1;
    if (G.currentLeaderIndex >= G.players.length) G.currentLeaderIndex = 0;
    G.turn++;
    G.phase = 'association';
    focusPlayer(getLeader()?.id || G.players[0]?.id || HOST_ID);
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;
    // Как и при обычном переходе хода — сначала убеждаемся, что карт хватит
    // на добор рук, иначе показываем тот же явный выбор колоды, а не тихо
    // раздаём неполные руки.
    if (!ensureEnoughCards('refillOnly')) return;
    refillHandsRoundRobin(G.players);
    renderGame();
  }

  function fullResetToLanding(){
    if (G.isRoomHost) closeRoomInFirebase();
    stopNetworking();
    G = {
      players: [], botPlayers: [], currentLeaderIndex:0, turn:0, phase:'setup',
      association:'', associationInput:'', votes:{}, votes2:{}, leaderCardIndex:-1,
      playedCards:[], selectedCardIndex:-1, selectedCardForPlayer:{}, selectedVoteForPlayer:{}, selectedCards2:{},
      placedPlayers:[], leaderCard:null, mammothCard:null,
      myId:HOST_ID, isHost:true, isRoomHost:true, roomId:'—', gameMode:'4plus', gameStarted:false,
      gameOver:false, stopReason:'', awaitingContinueDecision:false, finishInfo:null, finishInfoPlayerId:null,
      pendingRawCommon:null, pendingRawMammoth:null,
      selectedDeckIds:[], awaitingDeckDecision:false, deckDecisionInfo:null,
      deckSwitchPickerOpen:false, pendingAdvanceMode2:false, playerPresence:{},
      mammothPosition:0, commonSlonPosition:0,
      activePlayerId:null, pawnAnim:{}, pawnAnimLock:{},
      animCommon:{from:0,to:0,progress:1}, animMammoth:{from:0,to:0,progress:1},
      deck: shuffle(buildPoolFromDecks(['baza','new_year','detstvo','x','sumchatyy'], new Set())), discard:[], lastResult:null,
      showField:false, fieldTimer:null,
    };
    qrBlock.style.display = 'none';
    showScreen('screenIntro');
    toast('Комната закрыта. Прогресс сброшен.', 'info');
  }

  function resetGameKeepPlayers(){
    G.currentLeaderIndex = 0;
    G.turn = 0;
    G.phase = 'waiting';
    G.association = ''; G.associationInput = '';
    G.votes = {}; G.votes2 = {};
    G.leaderCardIndex = -1;
    G.playedCards = [];
    G.selectedCardIndex = -1;
    G.selectedCardForPlayer = {}; G.selectedVoteForPlayer = {}; G.selectedCards2 = {};
    G.mammothPosition = 0; G.commonSlonPosition = 0;
    G.gameOver = false; G.stopReason = '';
    G.awaitingContinueDecision = false; G.finishInfo = null; G.finishInfoPlayerId = null;
    G.pendingRawCommon = null; G.pendingRawMammoth = null;
    G.awaitingDeckDecision = false; G.deckDecisionInfo = null; G.deckDecisionAfterAction = null;
    G.deckSwitchPickerOpen = false; G.pendingAdvanceMode2 = false;
    G.placedPlayers = [];
    G.leaderCard = null; G.mammothCard = null;
    G.gameMode = '4plus';
    G.gameStarted = false;
    G.pawnAnim = {};
    G.pawnAnimLock = {};
    G.deck = shuffle(buildPoolFromDecks(G.selectedDeckIds, new Set()));
    G.discard = [];
    G.animCommon = { from:0, to:0, progress:1 };
    G.animMammoth = { from:0, to:0, progress:1 };
    G.lastResult = null;
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;

    G.players.forEach(p => { p.score = 0; p.position = 0; p._prevPos = 0; p.cards = []; });
    dealAllPlayers();
    G.myId = HOST_ID; G.isHost = true;

    showScreen('screenRoom');
    updateRoomUI();
    toast('Игра сброшена. Игроки остались в комнате — можно подключать или убирать их.', 'success');
  }

  // ===================================================================
  // РЕНДЕРЫ
  // ===================================================================
  function updateRoomUI(){
    const host = getPlayer(HOST_ID);
    document.getElementById('roomIdDisplay').textContent = G.roomId;
    document.getElementById('roomIdDisplay').classList.toggle('hidden', !G.isRoomHost);
    document.getElementById('qrBlock').classList.toggle('hidden', !G.isRoomHost);
    const playersList = document.getElementById('playersList');
    playersList.innerHTML = '';
    G.players.forEach(p => {
      const tag = document.createElement('span');
      tag.className = 'player-tag';
      tag.style.borderLeftColor = p.color;
      const isBot = isBotId(p.id);
      const isHostPlayer = p.id === HOST_ID;
      const isOffline = G.playerPresence && G.playerPresence[p.id] === 'offline';
      if (isOffline) tag.style.opacity = '.5';
      tag.innerHTML = `
        <span style="color:${p.color}; font-weight:700;">${isBot ? '' : (p.avatar || '🐘') + ' '}${escapeHtml(p.name)}</span>
        ${isHostPlayer ? '🖥️' : ''}
        ${isBot ? '🤖' : ''}
        ${isOffline ? '📴' : ''}
        ${(G.isRoomHost && !isHostPlayer) ? '<span class="remove-x" data-remove="'+p.id+'">✕</span>' : ''}
      `;
      playersList.appendChild(tag);
    });
    playersList.querySelectorAll('[data-remove]').forEach(el => {
      el.addEventListener('click', () => removePlayer(el.getAttribute('data-remove')));
    });

    document.getElementById('startGameBtn').classList.toggle('hidden', !G.isRoomHost);
    document.getElementById('startGameBtn').disabled = G.players.length < 2;
    document.getElementById('deckBrowseBtn').classList.toggle('hidden', G.isRoomHost);
    document.getElementById('waitingForHostNote').classList.toggle('hidden', G.isRoomHost);
    document.getElementById('roomHostPanel').classList.toggle('hidden', !G.isRoomHost);
    if (G.isRoomHost) {
      document.getElementById('addBotBtnGlobal').disabled = false;
      document.getElementById('clearBotsBtnGlobal').disabled = G.botPlayers.length === 0;
    }
    refreshRoleUI();
    if (G.isRoomHost){ broadcastState(); syncAllHands(); }
  }

  function refreshRoleUI(){
    document.getElementById('resetGameBtn').classList.toggle('hidden', !G.isRoomHost);
    document.getElementById('exitGameBtn').textContent = G.isRoomHost ? '🚪 Выйти и закрыть комнату' : '🚪 Покинуть игру';
  }

  function renderGame(){
    if (G.showField || manualFieldView) {
