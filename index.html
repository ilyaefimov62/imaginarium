      fieldContainer.classList.add('visible');
    } else {
      fieldContainer.classList.remove('visible');
    }
    fieldContainer.classList.toggle('overlay-mode', manualFieldView);
    document.getElementById('fieldCloseBtn').classList.toggle('hidden', !manualFieldView);
    renderPlayersPanel();
    renderPlayerWindow();
    updatePawnPositions();
    if (G.isRoomHost){ broadcastState(); syncAllHands(); }
  }

  function renderPlayersPanel(){
    const panel = document.getElementById('playersPanel');
    panel.innerHTML = '';
    G.players.forEach(p => {
      const div = document.createElement('div');
      div.className = 'player-avatar';
      if (p.id === G.activePlayerId) div.classList.add('active');
      if (p.id === getLeader()?.id) div.classList.add('leader');
      if (isBotId(p.id)) div.classList.add('bot');
      if (p.id === HOST_ID) div.classList.add('is-host');
      const isOffline = G.playerPresence && G.playerPresence[p.id] === 'offline';
      if (isOffline) div.classList.add('offline');
      div.style.borderColor = p.color;

      const statusDot = getPlayerActionStatus(p.id);
      const canRemove = G.isRoomHost && p.id !== HOST_ID;

      div.innerHTML = `
        <span class="emoji-big">${isBotId(p.id) ? '🤖' : (p.avatar || '🐘')}</span>
        <span class="name">${escapeHtml(p.name)}</span>
        ${isOffline ? `<span class="offline-badge" title="Не в сети">📴</span>` : ''}
        ${statusDot ? `<span class="status-dot ${statusDot.cls}">${statusDot.icon}</span>` : ''}
        ${canRemove ? `<span class="leave-x" data-leave="${p.id}">✕</span>` : ''}
      `;
      div.addEventListener('click', (e) => {
        if (e.target.closest('[data-leave]')) return;
        if (!G.isRoomHost) return;
        if (p.id !== HOST_ID && !isBotId(p.id)){
          toast('У этого игрока своё устройство — переключиться на его экран нельзя', 'info');
          return;
        }
        if (G.activePlayerId !== p.id){
          G.activePlayerId = p.id;
          setViewer(p.id);
          renderGame();
        }
      });
      panel.appendChild(div);
    });
    panel.querySelectorAll('[data-leave]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-leave');
        const p = getPlayer(id);
        if (!p) return;
        if (!G.isRoomHost){ toast('Убирать других игроков может только хост', 'warn'); return; }
        showConfirm(`Убрать ${p.name} из игры? Очки сгорят.`, () => removePlayer(id));
      });
    });
  }

  function setViewer(playerId){
    G.myId = playerId;
    G.isHost = (playerId === HOST_ID);
    refreshRoleUI();
  }

  function focusPlayer(playerId){
    if (playerId === HOST_ID || isBotId(playerId)){
      G.activePlayerId = playerId;
    } else {
      G.activePlayerId = HOST_ID;
    }
  }

  function getPlayerActionStatus(id){
    const leader = getLeader();
    if (!leader || G.gameOver) return null;
    if (G.phase === 'placing'){
      if (G.gameMode === '2'){
        const sel = G.selectedCards2[id] || [];
        if (G.placedPlayers.includes(id)) return { cls:'done', icon:'✓' };
        return { cls:'pending', icon:'…' };
      }
      if (id === leader.id) return null;
      if (G.placedPlayers.includes(id)) return { cls:'done', icon:'✓' };
      return { cls:'pending', icon:'…' };
    }
    if (G.phase === 'voting'){
      if (G.gameMode !== '2' && id === leader.id) return null;
      const votes = G.gameMode === '2' ? G.votes2 : G.votes;
      if (votes[id] !== undefined) return { cls:'done', icon:'✓' };
      return { cls:'pending', icon:'…' };
    }
    return null;
  }

  // ====== РЕНДЕР ОКНА ИГРОКА ======
  function renderPlayerWindow(){
    const active = getActivePlayer();
    if (!active){
      document.getElementById('windowContent').innerHTML = '<div class="info-text">Выберите игрока на панели слева</div>';
      return;
    }

    let html = '';
    const phase = G.phase;
    const leader = getLeader();
    const isLeader = leader && active.id === leader.id;

    // Диалог выбора колоды показываем поверх ЛЮБОЙ фазы — не только после
    // голосования (например, раунд мог прерваться из-за ухода ведущего
    // как раз в момент нехватки карт).
    if (G.awaitingDeckDecision){
      html = renderDeckDecisionHtml();
      document.getElementById('windowContent').innerHTML = html;
      bindPhaseHandlers(phase, active, leader, isLeader);
      return;
    }

    // Игру можно закончить не только после финиша, но и прямо с экрана
    // решения по колоде — экран окончания игры показываем поверх ЛЮБОЙ фазы,
    // включая 'result': итоги последнего раунда при этом не подводим — сразу
    // объявление победителя и таблица итоговых очков по местам.
    if (G.gameOver){
      html = `<div class="announce">${getWinnerAnnouncementHtml()}</div>` + getFinalStandingsHtml();
      document.getElementById('windowContent').innerHTML = html;
      bindPhaseHandlers(phase, active, leader, isLeader);
      return;
    }

    if (phase === 'stopped'){
      html = `<div class="info-text warn">⛔ ${escapeHtml(G.stopReason || 'Игра остановлена.')}</div>`;
      if (G.isRoomHost){
        html += `<div class="info-text">Хост может сбросить игру, чтобы подключить нужное число игроков и начать заново.</div>`;
      } else {
        html += `<div class="info-text">Ожидайте решения хоста.</div>`;
      }
    }
    else if (phase === 'waiting'){
      html = `<div class="info-text">Ожидание начала игры...</div>`;
    }
    else if (phase === 'association'){
      if (isLeader) {
        if (G.gameMode === '2') {
          // Режим на двоих: ведущий придумывает ассоциацию НЕ глядя в
          // свои карты — выбора карты на этом шаге нет вообще (карты обе
          // стороны выберут позже, на шаге "placing").
          html = `<div class="announce">Придумайте ассоциацию, не глядя в свои карты</div>`;
          html += `<div class="input-group" style="width:100%;"><input type="text" id="assocInput2" class="input-big" placeholder="Ассоциация" value="${escapeHtml(G.associationInput)}"></div>`;
          html += `<button class="btn action-btn" id="submitAssocBtn2">📨 Отправить</button>`;
        } else {
          // Ведущий – теперь как у игрока по размеру (big-sub), но с градиентом
          html = `<div class="announce">Придумайте ассоциацию и выберите карту</div>`;
          html += `<div class="input-group" style="width:100%;"><input type="text" id="assocInput" class="input-big" placeholder="Ассоциация" value="${escapeHtml(G.associationInput)}"></div>`;
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            const sel = G.selectedCardIndex === idx ? 'selected' : '';
            html += `<div class="card ${sel}" data-card-index="${idx}" onclick="Game.selectLeaderCard(${idx})">`;
            html += cardFaceHtml(card);
            html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button>`;
            html += `</div>`;
          });
          html += `</div>`;
          html += `<button class="btn action-btn" id="submitAssocBtn" ${G.selectedCardIndex===-1?'disabled':''}>📨 Отправить</button>`;
        }
      } else {
        // Игрок – обычный серый текст
        const leaderName = leader ? colorPlayerName(leader.id) : '—';
        html = `<div class="announce">Ведущий ${leaderName} загадывает ассоциацию. Ожидайте...</div>`;
        // Предпросмотр своей руки, пока ведущий думает — актуально только
        // для обычных режимов; в режиме на двоих карты для этого раунда
        // ещё даже не имеют смысла показывать так (там другие правила
        // выбора карт на шаге "placing"), поэтому здесь не показываем.
        if (G.gameMode !== '2') {
          html += `<div class="card-grid" style="margin-top:16px;">`;
          (active.cards || []).forEach((card, idx) => {
            html += `<div class="card no-select" onclick="openCardViewer(window.getMyHandForViewer(), ${idx})">`;
            html += cardFaceHtml(card);
            html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button>`;
            html += `</div>`;
          });
          html += `</div>`;
        }
      }
    }
    else if (phase === 'placing'){
      const isMode2 = G.gameMode === '2';
      if (isMode2) {
        if (G.placedPlayers.includes(active.id)) {
          const notPlaced = G.players.filter(p => !G.placedPlayers.includes(p.id));
          const waitMsg = notPlaced.length ? `Ожидайте: ${notPlaced.map(p=>colorPlayerName(p.id)).join(', ')}` : 'Ожидайте остальных игроков.';
          html = `<div class="info-text success">✅ Вы выбрали карты. ${waitMsg}</div>`;
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            html += `<div class="card no-select" onclick="openCardViewer(window.getMyHandForViewer(), ${idx})">${cardFaceHtml(card)}<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button></div>`;
          });
          html += `</div>`;
        } else {
          const assocText = G.association ? ` «${escapeHtml(G.association)}»` : '';
          html = `<div class="announce">🎯 Выберите 2 карты под ассоциацию${assocText}</div>`;
          const selected = G.selectedCards2[active.id] || [];
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            const sel = selected.includes(idx) ? 'selected' : '';
            html += `<div class="card ${sel}" onclick="Game.toggleCard2(${idx})">`;
            html += cardFaceHtml(card);
            html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button>`;
            html += `</div>`;
          });
          html += `</div>`;
          html += `<button class="btn btn-success action-btn" id="submitCardBtn2" ${selected.length<2?'disabled':''}>📤 Отправить (${selected.length}/2)</button>`;
        }
      } else {
        if (isLeader) {
          const others = G.players.filter(p => p.id !== leader.id);
          const placed = G.placedPlayers.length, total = others.length;
          if (placed >= total) {
            html = `<div class="info-text">🃏 Все игроки выбрали карты. Переходим к голосованию...</div>`;
          } else {
            const waitingFor = others.filter(p => !G.placedPlayers.includes(p.id)).map(p=>colorPlayerName(p.id)).join(', ');
            html = `<div class="info-text">⏳ Ожидаем карты от: ${waitingFor} <span style="color:var(--text-dim)">(${placed}/${total})</span></div>`;
          }
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            html += `<div class="card no-select" onclick="openCardViewer(window.getMyHandForViewer(), ${idx})">${cardFaceHtml(card)}<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button></div>`;
          });
          html += `</div>`;
        } else if (G.placedPlayers.includes(active.id)) {
          html = `<div class="info-text success">✅ Карта отправлена. Ожидайте остальных игроков.</div>`;
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            html += `<div class="card no-select" onclick="openCardViewer(window.getMyHandForViewer(), ${idx})">${cardFaceHtml(card)}<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button></div>`;
          });
          html += `</div>`;
        } else {
          const assocText = G.association ? ` «${escapeHtml(G.association)}»` : '';
          html = `<div class="announce">🃏 Выберите карту под ассоциацию${assocText}</div>`;
          html += `<div class="card-grid">`;
          (active.cards || []).forEach((card, idx) => {
            const sel = G.selectedCardForPlayer[active.id] === idx ? 'selected' : '';
            html += `<div class="card ${sel}" onclick="Game.selectCard(${idx})">`;
            html += cardFaceHtml(card);
            html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getMyHandForViewer(), ${idx})">🔍</button>`;
            html += `</div>`;
          });
          html += `</div>`;
          html += `<button class="btn action-btn" id="submitCardBtn" ${G.selectedCardForPlayer[active.id]===undefined?'disabled':''}>📤 Отправить</button>`;
        }
      }
    }
    else if (phase === 'voting'){
      const isMode2 = G.gameMode === '2';
      const votesObj = isMode2 ? G.votes2 : G.votes;
      const votersNeeded = isMode2 ? G.players.length : G.players.filter(p => p.id !== leader.id).length;
      const allVoted = Object.keys(votesObj).length >= votersNeeded;
      const leaderCardIdx = G.leaderCardIndex;
      const cards = G.playedCards || [];

      if (!isMode2 && isLeader) {
        const assocText = G.association ? ` «${escapeHtml(G.association)}»` : '';
        html = `<div class="info-text">${allVoted ? '🗳️ Голосование завершено.' : '⏳ Игроки голосуют. Ожидайте...'}${assocText}</div>`;
        html += `<div class="card-grid">`;
        cards.forEach((item, idx) => {
          const isLC = idx === leaderCardIdx;
          const style = isLC ? `border-color:${getPlayerColor(leader.id)}; border-width:4px;` : '';
          html += `<div class="card played ${isLC?'leader-card':''}" style="opacity:1; ${style}" onclick="openCardViewer(window.getPlayedCardsForViewer(), ${idx})">`;
          html += cardFaceHtml(item.card);
          html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getPlayedCardsForViewer(), ${idx})">🔍</button>`;
          html += `</div>`;
        });
        html += `</div>`;
      } else {
        const alreadyVoted = votesObj[active.id] !== undefined;
        const assocText = G.association ? ` «${escapeHtml(G.association)}»` : '';
        if (alreadyVoted) {
          html = `<div class="info-text success">✅ Вы проголосовали. Ожидайте остальных.${assocText}</div>`;
        } else {
          html = `<div class="announce">🔮 Угадайте карту ${isMode2 ? 'мамонта' : 'ведущего'}${assocText}</div>`;
        }
        html += `<div class="card-grid">`;
        cards.forEach((item, idx) => {
          const isMy = item.playerId === active.id;
          const canSelect = votesObj[active.id] === undefined && !isMy && !allVoted;
          const sel = G.selectedVoteForPlayer[active.id] === idx ? 'selected' : '';
          const click = canSelect ? `onclick="Game.selectVoteCard(${idx})"` : '';
          html += `<div class="card ${sel} ${isMy?'my-card':''} ${!canSelect && votesObj[active.id]===undefined ? 'no-select':''}" ${click}>`;
          html += cardFaceHtml(item.card);
          if (isMy) html += `<span class="my-label">Ваша</span>`;
          html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getPlayedCardsForViewer(), ${idx})">🔍</button>`;
          html += `</div>`;
        });
        html += `</div>`;
        if (!alreadyVoted && !allVoted) {
          const btnId = isMode2 ? 'voteSubmitBtn2' : 'voteSubmitBtn';
          html += `<button class="btn action-btn" id="${btnId}" ${G.selectedVoteForPlayer[active.id]===undefined?'disabled':''}>✅ Голосовать</button>`;
        }
      }
    }
    else if (phase === 'result'){
      html = renderResultPhase(active);
    }
    else {
      html = `<div class="info-text">Неизвестная фаза</div>`;
    }

    document.getElementById('windowContent').innerHTML = html;
    bindPhaseHandlers(phase, active, leader, isLeader);
  }

  // ====== РЕНДЕР РЕЗУЛЬТАТОВ ======
  function renderResultPhase(active){
    return G.showField ? renderFieldSummaryPhase(active) : renderResultCardsPhase(active);
  }

  // ====== ЭКРАН 1 ПОСЛЕ ГОЛОСОВАНИЯ: КАРТЫ С МЕТКАМИ ГОЛОСОВ ======
  function renderResultCardsPhase(active){
    const result = G.lastResult;
    if (!result) return `<div class="info-text">Нет результатов</div>`;

    const cards = result.playedCards || [];
    const votes = result.votes || {};
    const leaderCardIdx = result.leaderCardIndex;
    const isMammoth = result.mode === '2';

    let html = `<div class="announce">🏁 Результаты хода ${G.turn}</div>`;
    if (result.association && result.association.trim()) html += `<div><strong>Ассоциация:</strong> «${escapeHtml(result.association)}»</div>`;

    html += `<div class="card-grid">`;
    cards.forEach((item, idx) => {
      const isMy = item.playerId === active.id;
      const voterIcons = getVoterIconsHtml(votes, idx);
      const isLC = idx === leaderCardIdx;
      const isBotCard = item.playerId && item.playerId.startsWith('bot_card_');
      const ownerColor = isBotCard ? 'transparent' : getPlayerColorSafeId(item.playerId);
      const borderWidth = isLC ? '5px' : '3px';
      const leaderClass = isLC ? (isMammoth ? 'mammoth-card' : 'leader-card') : '';
      html += `<div class="card played ${isMy?'my-card':''} ${leaderClass} owner-card" style="opacity:1; cursor:default; border-color:${ownerColor}; border-width:${borderWidth};" onclick="openCardViewer(window.getResultCardsForViewer(), ${idx})">`;
      html += cardFaceHtml(item.card);
      if (isMy) html += `<span class="my-label">Ваша</span>`;
      html += voterIcons;
      html += `<button class="view-btn" onclick="event.stopPropagation(); openCardViewer(window.getResultCardsForViewer(), ${idx})">🔍</button>`;
      html += `</div>`;
    });
    html += `</div>`;

    if (G.isRoomHost){
      html += `<button class="btn action-btn" id="showFieldBtn">⏩ Продолжить</button>`;
    } else {
      html += `<div class="info-text" style="margin-top:8px;">⏳ Ожидайте хоста.</div>`;
    }
    return html;
  }

  // ====== ЭКРАН 2 ПОСЛЕ ГОЛОСОВАНИЯ: ПОЛЕ + ПОДРОБНЫЕ ИТОГИ ======
  // Сюда мы попадаем, только когда игра ещё продолжается — при G.gameOver
  // рендер уходит по отдельной ветке (чистый экран "Победитель" без разбора
  // последнего раунда), см. её выше по коду.
  function renderFieldSummaryPhase(active){
    const result = G.lastResult;
    if (!result) return `<div class="info-text">Нет результатов</div>`;
    const isMammoth = result.mode === '2';

    let topHtml = '';
    if (G.awaitingContinueDecision){
      let finishMsg;
      if (isMammoth){
        finishMsg = G.finishInfo || 'Кто-то дошёл до финиша!';
      } else {
        const reachedByMe = G.finishInfoPlayerId === G.myId;
        finishMsg = reachedByMe
          ? '🏁 Вы достигли финиша!'
          : `🏁 ${escapeHtml(getPlayer(G.finishInfoPlayerId)?.name || 'Игрок')} достиг финиша!`;
      }
      topHtml = `<div class="announce">${finishMsg}</div>`;
    }

    let html = topHtml;
    html += `<div class="round-summary"><div class="rs-title">📊 Итоги раунда</div>`;
    if (isMammoth){
      const guessers = result.guessers || [];
      const total = guessers.length;
      let desc = total === 0 ? '0 оч. — никто не угадал карту мамонта'
        : total === 2 ? '+2 оч. — оба угадали карту мамонта'
        : `+1 оч. — карту мамонта угадал ${escapeHtml(getPlayer(guessers[0])?.name || '')}`;
      html += `<div style="margin-top:4px;">${desc}</div>`;
      html += `<div>${result.mammothPoints > 0 ? '+' + result.mammothPoints : 0} оч. мамонту</div>`;
      html += `<div style="margin-top:4px; color:var(--text-dim);">Общий слон: клетка ${result.commonSlonPosition % TRACK_TOTAL}</div>`;
      html += `<div style="color:var(--text-dim);">Мамонт: клетка ${result.mammothPosition % TRACK_TOTAL}</div>`;
    } else {
      const isLeaderPlayer = active.id === result.leader.id;
      const guessers = result.guessers || [];
      const pointsGuess = result.pointsGuess || {};
      const pointsVotes = result.pointsVotes || {};
      const totalVoters = result.totalVoters || 0;

      if (isLeaderPlayer){
        const guessCount = guessers.length;
        const leaderGuessPoints = pointsGuess[active.id] || 0;
        const desc = guessCount === 0 ? '0 оч. — вашу карту не угадал никто'
          : guessCount === totalVoters ? '0 оч. — вашу карту угадали все'
          : `+${leaderGuessPoints} оч. — вашу карту угадали, но не все`;
        const leaderVotes = pointsVotes[active.id] || 0;
        html += `<div style="margin-top:4px;">${desc}</div>`;
        if (leaderVotes > 0) html += `<div>+${leaderVotes} оч. за голоса</div>`;
        html += `<div class="result-total">Итого: +${leaderGuessPoints + leaderVotes} оч.</div>`;
      } else {
        const guessPoints = pointsGuess[active.id] || 0;
        const votePoints = pointsVotes[active.id] || 0;
        const guessText = guessPoints > 0 ? `+${guessPoints} оч. — вы угадали карту ведущего` : '0 оч. — вы не угадали карту ведущего';
        html += `<div style="margin-top:4px;">${guessText}</div>`;
        html += `<div>${votePoints > 0 ? '+' + votePoints : 0} оч. за голоса</div>`;
        html += `<div class="result-total">Итого: +${guessPoints + votePoints} оч.</div>`;
      }
      // Суммарный счёт за игру (не позиция на поле — она сбрасывается
      // каждый круг, и на 2+ круге путала бы игрока, если показывать
      // именно клетку). Позицию и так видно на игровом поле.
      html += `<div style="margin-top:4px; color:var(--text-dim);">Всего очков: ${active.score}</div>`;
    }
    html += `</div>`;

    if (G.awaitingContinueDecision){
      if (G.isRoomHost){
        html += `<div class="stack-btns">
          <button class="btn btn-success" id="continueGameBtn">Сыграть ещё круг</button>
          <button class="btn btn-danger" id="finishGameBtn">Закончить игру</button>
        </div>`;
      } else {
        html += `<div class="info-text">⏳ Хост решает: закончить игру или сыграть ещё круг.</div>`;
      }
    } else if (G.awaitingDeckDecision){
      html += renderDeckDecisionHtml();
    } else if (G.isRoomHost){
      html += `<button class="btn action-btn" id="nextTurnBtnMain">⏩ Продолжить</button>`;
    } else {
      html += `<div class="info-text" style="margin-top:8px;">⏳ Ожидайте, пока хост запустит следующий ход.</div>`;
    }
    return html;
  }

  // ====== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ======
  function getPlayerColorSafe(playerObj){ return getPlayer(playerObj?.id)?.color || playerObj?.color || '#fff'; }
  function getPlayerColorSafeId(id){ return getPlayer(id)?.color || '#fff'; }

  function getVoterIconsHtml(votes, cardIndex){
    const voters = [];
    for (const id in votes){ if (votes[id] === cardIndex){ const p = getPlayer(id); if (p) voters.push(p); } }
    if (!voters.length) return '';
    return `<div class="voter-icons">${voters.map(p => `<span class="voter" style="color:${p.color};">${escapeHtml(p.name)}</span>`).join('')}</div>`;
  }

  // ====== ОБРАБОТЧИКИ ФАЗ ======
  function bindPhaseHandlers(phase, active, leader, isLeader){
    if (phase === 'association' && isLeader){
      if (G.gameMode !== '2'){
        const btn = document.getElementById('submitAssocBtn'), input = document.getElementById('assocInput');
        if (btn && input){
          input.addEventListener('input', () => { G.associationInput = input.value; });
          btn.addEventListener('click', () => {
            if (G.selectedCardIndex === -1) return toast('Сначала выберите карту', 'warn');
            Game.submitAssociation(input.value.trim());
          });
        }
      } else {
        const btn = document.getElementById('submitAssocBtn2'), input = document.getElementById('assocInput2');
        if (btn && input){
          input.addEventListener('input', () => { G.associationInput = input.value; });
          btn.addEventListener('click', () => Game.submitAssociation2(input.value.trim()));
        }
      }
    } else if (phase === 'placing'){
      if (G.gameMode === '2'){
        const btn = document.getElementById('submitCardBtn2');
        if (btn) btn.addEventListener('click', () => {
          if ((G.selectedCards2[active.id]||[]).length < 2) return toast('Выберите 2 карты', 'warn');
          Game.submitCards2();
        });
      } else if (!isLeader){
        const btn = document.getElementById('submitCardBtn');
        if (btn) btn.addEventListener('click', () => {
          if (G.selectedCardForPlayer[active.id] === undefined) return toast('Выберите карту', 'warn');
          Game.submitCard();
        });
      }
    } else if (phase === 'voting'){
      const btn = G.gameMode === '2' ? document.getElementById('voteSubmitBtn2') : (!isLeader ? document.getElementById('voteSubmitBtn') : null);
      if (btn) btn.addEventListener('click', () => {
        if (G.selectedVoteForPlayer[active.id] === undefined) return toast('Выберите карту', 'warn');
        G.gameMode === '2' ? Game.submitVote2() : Game.submitVote();
      });
    }

    const showFieldBtn = document.getElementById('showFieldBtn');
    if (showFieldBtn){
      showFieldBtn.addEventListener('click', () => {
        if (!G.isRoomHost) return;
        if (G.phase !== 'result' || G.showField) return;
        showFieldNow();
      });
    }

    const nextBtn = document.getElementById('nextTurnBtnMain');
    if (nextBtn){
      nextBtn.addEventListener('click', () => {
        if (!G.isRoomHost) return;
        if (G.gameOver){ toast('Игра окончена — нажмите «Сбросить игру»', 'warn'); return; }
        if (G.awaitingContinueDecision){ toast('Сначала решите: закончить игру или сыграть ещё круг', 'warn'); return; }
        if (G.phase !== 'result') return;
        const isMode2 = G.gameMode === '2';
        if (!ensureEnoughCards()) return;
        if (isMode2) nextTurn2();
        else nextTurnStandard();
      });
    }

    const finishBtn = document.getElementById('finishGameBtn');
    if (finishBtn) finishBtn.addEventListener('click', () => { if (G.isRoomHost) finishGameAtFinish(); });
    const continueBtn = document.getElementById('continueGameBtn');
    if (continueBtn) continueBtn.addEventListener('click', () => { if (G.isRoomHost) continueGameAfterFinish(); });

    const continueDeckBtn = document.getElementById('continueDeckBtn');
    if (continueDeckBtn) continueDeckBtn.addEventListener('click', () => { if (G.isRoomHost) resolveDeckDecision('continue'); });
    const switchDeckBtn = document.getElementById('switchDeckBtn');
    if (switchDeckBtn) switchDeckBtn.addEventListener('click', () => {
      if (!G.isRoomHost) return;
      openDeckPickerForSwitch();
    });
    const finishGameFromDeckBtn = document.getElementById('finishGameFromDeckBtn');
    if (finishGameFromDeckBtn) finishGameFromDeckBtn.addEventListener('click', () => { if (G.isRoomHost) finishGameFromDeckDecision(); });
  }

  // ====== ПОКАЗ ПОЛЯ (без автотаймера, синхронизируется всем игрокам) ======
  function showFieldNow(){
    G.showField = true;
    manualFieldView = false; // страховка: не даём двум режимам поля включиться одновременно
    renderGame();
    // Принудительная перерисовка поля в следующем кадре, чтобы гарантировать отображение
    requestAnimationFrame(() => { drawFieldAnimated(); });
  }

  // Локальный (несинхронизируемый) флаг ручного просмотра игрового поля —
  // доступен в любой момент игры любому игроку через кнопку «🗺️ Игровое поле».
  let manualFieldView = false;
  function openManualFieldView(){
    // Если поле и так уже показано на экране результатов (G.showField),
    // полноэкранный режим не нужен — он перекрыл бы собой кнопку «Продолжить»
    // прямо под полем. В этом случае просто ничего не делаем: поле уже видно.
    if (G.showField) return;
    manualFieldView = true;
    renderGame();
    requestAnimationFrame(() => { drawFieldAnimated(); });
  }
  function closeManualFieldView(){
    manualFieldView = false;
    renderGame();
  }

  // ====== ДОПОЛНИТЕЛЬНЫЕ ФУНКЦИИ ======
  function renderDeckDecisionHtml(){
    const info = G.deckDecisionInfo || { needed:0, available:0 };
    const canContinue = info.available >= info.needed;
    if (!G.isRoomHost){
      return `<div class="announce small">Колода закончилась, ожидайте решение хоста</div>`;
    }
    let html = `<div class="announce small">Колода закончилась, выберите действие:</div>`;
    html += `<div class="stack-btns">`;
    if (canContinue) html += `<button class="btn btn-success" id="continueDeckBtn">Продолжить этим набором</button>`;
    html += `<button class="btn btn-secondary" id="switchDeckBtn">Сменить набор</button>`;
    html += `<button class="btn btn-danger" id="finishGameFromDeckBtn">Закончить игру</button>`;
    html += `</div>`;
    return html;
  }

  // ===================================================================
  // ЛОББИ: ПРОСМОТР И ВЫБОР КОЛОД (плитки 3 в ряд)
  // ===================================================================
  function renderDeckLobbyGrid(){
    const grid = document.getElementById('deckLobbyGrid');
    const selectable = G.isRoomHost;
    if (!G.selectedDeckIds){ G.selectedDeckIds = []; }
    grid.innerHTML = CARD_DECKS.map(d => {
      const sel = G.selectedDeckIds.includes(d.id);
      return `<div class="deck-tile ${selectable && sel ? 'selected':''}" data-deck="${d.id}">
        ${d.cover ? `<img src="${d.cover}" alt="">` : ''}
        <button class="view-btn" data-view-deck="${d.id}" title="Просмотреть колоду">🔍</button>
        <div class="deck-tile-label">${escapeHtml(d.name)}</div>
        <div class="deck-tile-count">${d.cards.length} карт</div>
      </div>`;
    }).join('');

    grid.querySelectorAll('[data-view-deck]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openDeckContentView(btn.getAttribute('data-view-deck'));
      });
    });

    grid.querySelectorAll('.deck-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const id = tile.getAttribute('data-deck');
        if (selectable){
          let next = G.selectedDeckIds.slice();
          if (next.includes(id)){
            if (next.length <= 1){ toast('Должна остаться выбрана хотя бы одна колода', 'warn'); return; }
            next = next.filter(x => x !== id);
          } else {
            next.push(id);
          }
          G.selectedDeckIds = next;
          renderDeckLobbyGrid();
          if (G.isRoomHost){ broadcastState(); }
        } else {
          openDeckContentView(id);
        }
      });
    });
  }

  let deckPickerMode = 'browse'; // 'browse' — обзор из лобби, 'start' — выбор перед стартом игры, 'switch' — смена набора при нехватке карт посреди игры
  let deckSwitchSnapshotIds = null; // выбор колод на момент открытия попапа смены — чтобы вернуть его при отмене

  function openDeckLobbyBrowser(){
    deckPickerMode = 'browse';
    document.getElementById('deckLobbyTitle').textContent = G.isRoomHost
      ? 'Выберите колоды для игры'
      : 'Колоды карт — можно полистать, пока ждём остальных';
    renderDeckLobbyGrid();
    updateDeckLobbyFooter();
    document.getElementById('deckLobbyOverlay').classList.remove('hidden');
  }
  function openDeckPickerForStart(){
    deckPickerMode = 'start';
    document.getElementById('deckLobbyTitle').textContent = 'Выберите колоды для игры';
    renderDeckLobbyGrid();
    updateDeckLobbyFooter();
    document.getElementById('deckLobbyOverlay').classList.remove('hidden');
  }
  function openDeckPickerForSwitch(){
    deckPickerMode = 'switch';
    deckSwitchSnapshotIds = (G.selectedDeckIds || []).slice();
    document.getElementById('deckLobbyTitle').textContent = 'Выберите колоды для продолжения';
    renderDeckLobbyGrid();
    updateDeckLobbyFooter();
    document.getElementById('deckLobbyOverlay').classList.remove('hidden');
  }
  function updateDeckLobbyFooter(){
    const isStart = deckPickerMode === 'start';
    const isSwitch = deckPickerMode === 'switch';
    document.getElementById('deckLobbyCloseBtn').classList.toggle('hidden', isStart || isSwitch);
    document.getElementById('deckLobbyCancelBtn').classList.toggle('hidden', !(isStart || isSwitch));
    document.getElementById('deckLobbyStartBtn').classList.toggle('hidden', !isStart);
    document.getElementById('deckLobbyApplyBtn').classList.toggle('hidden', !isSwitch);
  }
  function closeDeckLobbyBrowser(){
    document.getElementById('deckLobbyOverlay').classList.add('hidden');
  }

  let deckViewCards = [];
  function openDeckContentView(deckId){
    const deck = getDeckById(deckId);
    if (!deck) return;
    document.getElementById('deckContentTitle').textContent = `${deck.name} — ${deck.cards.length} карт`;
    deckViewCards = deck.cards;
    document.getElementById('deckContentGrid').innerHTML = deck.cards.map((c, i) =>
      `<div class="card" data-view-idx="${i}">${cardFaceHtml(c)}</div>`
    ).join('');
    document.getElementById('deckContentGrid').querySelectorAll('[data-view-idx]').forEach(el => {
      el.addEventListener('click', () => openCardViewer(deckViewCards, Number(el.getAttribute('data-view-idx'))));
    });
    document.getElementById('deckContentOverlay').classList.remove('hidden');

  function closeDeckContentView(){
    document.getElementById('deckContentOverlay').classList.add('hidden');
  }

  document.getElementById('deckBrowseBtn').addEventListener('click', openDeckLobbyBrowser);
  document.getElementById('deckLobbyCloseBtn').addEventListener('click', closeDeckLobbyBrowser);
  document.getElementById('deckLobbyCloseX').addEventListener('click', closeDeckLobbyBrowser);
  document.getElementById('deckContentBackBtn').addEventListener('click', closeDeckContentView);
  document.getElementById('deckContentCloseX').addEventListener('click', closeDeckContentView);

  function finishGameFromDeckDecision(){
    if (!G.isRoomHost) return;
    G.awaitingDeckDecision = false;
    G.deckDecisionInfo = null;
    G.deckDecisionAfterAction = null;
    G.deckSwitchPickerOpen = false;
    G.gameOver = true;
    renderGame();
  }

  function getWinnerAnnouncementHtml(){
    if (G.gameMode === '2'){
      if (G.commonSlonPosition >= TRACK_TOTAL) return '🎉 Победа! Общий слон достиг финиша!';
      if (G.mammothPosition >= TRACK_TOTAL) return '💀 Мамонт победил!';
      return '🏁 Игра окончена!';
    }
    const winner = [...G.players].sort((a,b) => b.score - a.score)[0];
    return winner ? `🏁 Игра окончена! Победитель: ${escapeHtml(winner.name)}` : '🏁 Игра окончена!';
  }

  function getFinalStandingsHtml(){
    if (G.gameMode === '2'){
      return `<div class="round-summary" style="text-align:center;">
        <div>Общий слон: клетка ${G.commonSlonPosition % TRACK_TOTAL}</div>
        <div>Мамонт: клетка ${G.mammothPosition % TRACK_TOTAL}</div>
      </div>`;
    }
    const sorted = [...G.players].sort((a,b) => b.score - a.score);
    let html = `<div class="round-summary"><div class="rs-title">🏆 Итоговый счёт</div>`;
    sorted.forEach((p, i) => {
      html += `<div>${i+1}. ${escapeHtml(p.name)} — ${p.score} оч.</div>`;
    });
    html += `</div>`;
    return html;
  }

  function finishGameAtFinish(){
    G.gameOver = true;
    G.awaitingContinueDecision = false;
    renderGame();
  }

  function continueGameAfterFinish(){
    const mod = TRACK_TOTAL;

    if (G.gameMode === '2'){
      const rawCommon = G.pendingRawCommon != null ? G.pendingRawCommon : G.commonSlonPosition;
      const rawMammoth = G.pendingRawMammoth != null ? G.pendingRawMammoth : G.mammothPosition;
      G.commonSlonPosition = ((rawCommon % mod) + mod) % mod;
      G.mammothPosition = ((rawMammoth % mod) + mod) % mod;
      G.pendingRawCommon = null;
      G.pendingRawMammoth = null;
    } else {
      G.players.forEach(p => {
        const raw = p.pendingRawPos != null ? p.pendingRawPos : p.position;
        const wrapped = ((raw % mod) + mod) % mod;
        p.position = wrapped;
        p.pendingRawPos = null;
      });
    }

    G.awaitingContinueDecision = false;
    G.finishInfo = null; G.finishInfoPlayerId = null;
    toast('Продолжаем! Фишки едут дальше по кругу.', 'success');
    renderGame();
  }

  function resolveDeckDecision(mode){
    if (mode === 'continue'){
      // Карты из колод, которые сейчас НЕ выбраны (остались от прежнего выбора,
      // уже отыгранные и осевшие в сбросе), забываем навсегда — они не должны
      // возвращаться в игру после смены набора. Перетасовываем только те
      // отыгранные карты, что относятся к текущему выбору колод.
      const selectedSet = new Set(G.selectedDeckIds);
      const recyclable = G.discard.filter(c => c && selectedSet.has(c.deckId));
      // Сначала докладываем ещё не розданные карты текущей колоды (они
      // «наверху стопки» и раздаются первыми), и только когда они закончатся —
      // перемешанный сброс. Дублей быть не может: это одно и то же
      // объединение колода+сброс, просто с приоритетом порядка.
      G.deck = shuffle(recyclable).concat(shuffle(G.deck));
      G.discard = [];
    } else if (mode === 'switch'){
      const held = collectHeldCardUids();
      // Сохраняем ещё не розданные карты прежнего набора — они не сгорают
      // при смене колод, а раздаются в первую очередь. Исключаем их uid-ы
      // из свежего пула, чтобы при пересечении выбранных колод карта не
      // попала в раздачу дважды.
      const oldRemaining = G.deck.slice();
      const oldRemainingUids = new Set(oldRemaining.map(c => c.uid));
      const excludeUids = new Set([...held, ...oldRemainingUids]);
      const pool = buildPoolFromDecks(G.selectedDeckIds, excludeUids);
      if (oldRemaining.length + pool.length < calcNeededCards()){
        toast('В выбранных колодах всё ещё не хватает карт — добавьте ещё колоду', 'warn');
        return;
      }
      G.deck = shuffle(pool).concat(shuffle(oldRemaining));
      G.discard = [];
    }
    G.awaitingDeckDecision = false;
    G.deckDecisionInfo = null;
    G.deckSwitchPickerOpen = false;
    toast(mode === 'continue' ? 'Продолжаем этим набором карт!' : 'Колоды обновлены!', 'success');
    const afterAction = G.deckDecisionAfterAction || 'advance';
    G.deckDecisionAfterAction = null;
    if (afterAction === 'refillOnly'){
      refillHandsRoundRobin(G.players);
      renderGame();
    } else {
      const isMode2 = G.gameMode === '2';
      if (isMode2) nextTurn2();
      else nextTurnStandard();
    }
  }

  function nextTurnStandard(){
    if (G.gameOver || G.awaitingContinueDecision || G.awaitingDeckDecision) return;
    G.turn++;
    G.currentLeaderIndex = (G.currentLeaderIndex + 1) % G.players.length;
    resetRoundState();
    refillHandsRoundRobin(G.players);
    focusPlayer(getLeader()?.id || G.players[0]?.id || HOST_ID);
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;
    renderGame();
  }

  function nextTurn2(){
    if (G.gameOver || G.awaitingContinueDecision || G.awaitingDeckDecision) return;
    G.turn++;
    G.currentLeaderIndex = (G.currentLeaderIndex + 1) % G.players.length;
    resetRoundState();
    dealAllPlayers();
    focusPlayer(getLeader()?.id || G.players[0]?.id || HOST_ID);
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;
    renderGame();
  }

  function resetRoundState(){
    G.phase = 'association';
    G.votes = {}; G.votes2 = {};
    G.leaderCardIndex = -1;
    G.playedCards = [];
    G.association = ''; G.associationInput = '';
    G.placedPlayers = [];
    G.leaderCard = null; G.mammothCard = null;
    G.selectedCardIndex = -1;
    G.selectedCardForPlayer = {}; G.selectedVoteForPlayer = {}; G.selectedCards2 = {};
    G.lastResult = null;
    G.finishInfo = null; G.finishInfoPlayerId = null;
    G.pendingRawCommon = null; G.pendingRawMammoth = null;
  }

  // ===================================================================
  // ИГРОВЫЕ ДЕЙСТВИЯ (Game)
  // ===================================================================
  const Game = {};

  Game.selectLeaderCard = function(idx){
    if (G.phase !== 'association' || getActivePlayer()?.id !== getLeader()?.id) return;
    G.selectedCardIndex = idx; renderGame();
  };
  Game.selectCard = function(idx){
    if (G.phase !== 'placing' || getActivePlayer()?.id === getLeader()?.id) return;
    const active = getActivePlayer(); if (!active) return;
    G.selectedCardForPlayer[active.id] = idx; renderGame();
  };
  Game.toggleCard2 = function(idx){
    if (G.phase !== 'placing' || G.gameMode !== '2') return;
    const active = getActivePlayer(); if (!active) return;
    const sel = G.selectedCards2[active.id] || [];
    const pos = sel.indexOf(idx);
    if (pos !== -1) sel.splice(pos,1);
    else if (sel.length < 2) sel.push(idx);
    G.selectedCards2[active.id] = sel; renderGame();
  };
  Game.selectVoteCard = function(idx){
    if (G.phase !== 'voting') return;
    const active = getActivePlayer(); if (!active) return;
    const card = G.playedCards[idx];
    if (card && card.playerId === active.id){ toast('Нельзя голосовать за свою карту', 'warn'); return; }
    G.selectedVoteForPlayer[active.id] = idx; renderGame();
  };

  Game.submitAssociation = function(assoc){
    if (G.phase !== 'association' || getActivePlayer()?.id !== getLeader()?.id) return;
    if (G.selectedCardIndex === -1) return toast('Выберите карту', 'warn');
    if (!G.isRoomHost){ sendAction('submitAssociation', { cardIndex:G.selectedCardIndex, association:assoc }); return; }
    const leader = getLeader(); const leaderPlayer = getPlayer(leader.id);
    G.leaderCard = leaderPlayer.cards[G.selectedCardIndex];
    leaderPlayer.cards.splice(G.selectedCardIndex, 1);
    G.association = assoc; G.associationInput = '';
    G.phase = 'placing'; G.placedPlayers = []; G.playedCards = []; G.leaderCardIndex = -1; G.selectedCardIndex = -1;
    G.selectedCardForPlayer = {}; G.selectedVoteForPlayer = {};
    const firstOther = G.players.find(p => p.id !== leader.id);
    if (firstOther) focusPlayer(firstOther.id);
    renderGame();
  };

  Game.submitAssociation2 = function(assoc){
    if (G.phase !== 'association' || getActivePlayer()?.id !== getLeader()?.id) return;
    if (!G.isRoomHost){ sendAction('submitAssociation2', { association:assoc }); return; }
    const leader = getLeader();
    G.association = assoc; G.associationInput = '';
    G.phase = 'placing'; G.placedPlayers = []; G.playedCards = [];
    G.mammothCard = drawFromDeck();
    G.selectedCards2 = {}; G.votes2 = {};
    G.players.forEach(p => { G.selectedCards2[p.id] = []; });
    focusPlayer(leader.id);
    renderGame();
  };

  Game.submitCard = function(){
    if (G.phase !== 'placing' || G.gameMode === '2') return;
    const active = getActivePlayer(); const leader = getLeader();
    if (!active || !leader || active.id === leader.id || G.placedPlayers.includes(active.id)) return;
    const idx = G.selectedCardForPlayer[active.id];
    if (idx === undefined) return toast('Выберите карту', 'warn');
    if (!G.isRoomHost){ sendAction('submitCard', { cardIndex: idx }); return; }
    const card = active.cards[idx]; if (!card) return;
    active.cards.splice(idx, 1);
    G.placedPlayers.push(active.id);
    G.playedCards.push({ playerId: active.id, card });
    delete G.selectedCardForPlayer[active.id];
    renderGame();

    const others = G.players.filter(p => p.id !== leader.id);
    const allPlaced = others.every(p => G.placedPlayers.includes(p.id));
    if (allPlaced){
      G.playedCards.push({ playerId: leader.id, card: G.leaderCard });
      if (G.gameMode === '3'){
        for (let i=0;i<2;i++) G.playedCards.push({ playerId:'bot_card_'+i, card: drawFromDeck() });
      }
      shuffle(G.playedCards);
      G.leaderCardIndex = G.playedCards.findIndex(p => p.playerId === leader.id);
      G.phase = 'voting'; G.votes = {}; G.selectedCardIndex = -1; G.selectedVoteForPlayer = {};
      const firstOther = G.players.find(p => p.id !== leader.id);
      if (firstOther) focusPlayer(firstOther.id);
      renderGame();
    } else {
      const notPlaced = others.filter(p => !G.placedPlayers.includes(p.id));
      if (notPlaced.length){ focusPlayer(notPlaced[0].id); renderGame(); }
    }
  };

  Game.submitCards2 = function(){
    if (G.phase !== 'placing' || G.gameMode !== '2') return;
    const active = getActivePlayer(); if (!active || G.placedPlayers.includes(active.id)) return;
    const selected = G.selectedCards2[active.id] || [];
    if (selected.length < 2) return toast('Выберите 2 карты', 'warn');
    if (!G.isRoomHost){ sendAction('submitCards2', { cardIndexes: selected.slice() }); return; }
    [...selected].sort((a,b)=>b-a).forEach(idx => {
      G.playedCards.push({ playerId: active.id, card: active.cards[idx] });
      active.cards.splice(idx,1);
    });
    G.placedPlayers.push(active.id);
    G.selectedCards2[active.id] = [];
    renderGame();

    if (G.players.every(p => G.placedPlayers.includes(p.id))){
      if (G.mammothCard) G.playedCards.push({ playerId:'mammoth', card:G.mammothCard, isMammoth:true });
      shuffle(G.playedCards);
      G.leaderCardIndex = G.playedCards.findIndex(p => p.isMammoth === true);
      G.phase = 'voting'; G.votes2 = {}; G.selectedCardIndex = -1; G.selectedVoteForPlayer = {};
      focusPlayer(G.players[0].id);
      renderGame();
    } else {
      const notPlaced = G.players.filter(p => !G.placedPlayers.includes(p.id));
      if (notPlaced.length){ focusPlayer(notPlaced[0].id); renderGame(); }
    }
  };

  Game.submitVote = function(){
    if (G.phase !== 'voting' || G.gameMode === '2') return;
    const active = getActivePlayer(); const leader = getLeader();
    if (!active || !leader) return;
    if (active.id === leader.id) return toast('Ведущий не голосует', 'warn');
    if (G.votes[active.id] !== undefined) return;
    const chosenIdx = G.selectedVoteForPlayer[active.id];
    if (chosenIdx === undefined) return toast('Выберите карту', 'warn');
    const card = G.playedCards[chosenIdx];
    if (card && card.playerId === active.id) return toast('Нельзя голосовать за свою карту', 'warn');
    if (!G.isRoomHost){ sendAction('submitVote', { cardIndex: chosenIdx }); return; }
    G.votes[active.id] = chosenIdx;
    delete G.selectedVoteForPlayer[active.id];
    renderGame();

    const others = G.players.filter(p => p.id !== leader.id);
    if (Object.keys(G.votes).length >= others.length) calculateResultsStandard();
    else {
      const notVoted = others.filter(p => G.votes[p.id] === undefined);
      if (notVoted.length){ focusPlayer(notVoted[0].id); renderGame(); }
    }
  };

  Game.submitVote2 = function(){
    if (G.phase !== 'voting' || G.gameMode !== '2') return;
    const active = getActivePlayer(); if (!active) return;
    if (G.votes2[active.id] !== undefined) return;
    const chosenIdx = G.selectedVoteForPlayer[active.id];
    if (chosenIdx === undefined) return toast('Выберите карту', 'warn');
    const card = G.playedCards[chosenIdx];
    if (card && card.playerId === active.id) return toast('Нельзя голосовать за свою карту', 'warn');
    if (!G.isRoomHost){ sendAction('submitVote2', { cardIndex: chosenIdx }); return; }
    G.votes2[active.id] = chosenIdx;
    delete G.selectedVoteForPlayer[active.id];
    renderGame();

    if (Object.keys(G.votes2).length >= G.players.length) calculateResults2();
    else {
      const notVoted = G.players.filter(p => G.votes2[p.id] === undefined);
      if (notVoted.length){ focusPlayer(notVoted[0].id); renderGame(); }
    }
  };

  // ===================================================================
  // ПОДСЧЁТ ОЧКОВ
  // ===================================================================
  function calculateResults2(){
    const mammothIndex = G.leaderCardIndex;
    const guessers = Object.keys(G.votes2).filter(id => G.votes2[id] === mammothIndex);
    let mammothPoints = 0, playerPoints = 0;
    if (guessers.length === 0){ mammothPoints = 3; playerPoints = 0; }
    else if (guessers.length === 1){ mammothPoints = 1; playerPoints = 1; }
    else { mammothPoints = 0; playerPoints = 2; }

    G.players.forEach(p => { p.score += playerPoints; });

    const rawCommon = G.commonSlonPosition + playerPoints;
    const rawMammoth = G.mammothPosition + mammothPoints;
    const reachedFinish = rawCommon >= TRACK_TOTAL || rawMammoth >= TRACK_TOTAL;

    G.commonSlonPosition = reachedFinish ? Math.min(rawCommon, TRACK_TOTAL) : rawCommon;
    G.mammothPosition = reachedFinish ? Math.min(rawMammoth, TRACK_TOTAL) : rawMammoth;
    G.pendingRawCommon = rawCommon;
    G.pendingRawMammoth = rawMammoth;

    if (reachedFinish){
      G.awaitingContinueDecision = true;
      G.finishInfo = rawCommon >= TRACK_TOTAL
        ? `🎉 Общий слон дошёл до финиша (${G.commonSlonPosition} оч.)!`
        : `💀 Мамонт дошёл до финиша (${G.mammothPosition} оч.)!`;
    }

    G.lastResult = {
      mode:'2', votes:{...G.votes2}, guessers, mammothPoints, playerPoints,
      mammothPosition:G.mammothPosition, commonSlonPosition:G.commonSlonPosition,
      reachedFinish, leader:getLeader(), association:G.association,
      playedCards:[...G.playedCards], leaderCardIndex:G.leaderCardIndex,
      pointsGuess:{}, pointsVotes:{}, totalVoters:G.players.length,
    };

    G.playedCards.forEach(item => { if (item.card) G.discard.push(item.card); });
    G.playedCards = [];
    if (G.mammothCard){ G.discard.push(G.mammothCard); G.mammothCard = null; }

    G.phase = 'result';
    focusPlayer(HOST_ID);
    renderGame();
  }

  function calculateResultsStandard(){
    const leader = getLeader(); if (!leader) return;
    const leaderCardIndex = G.leaderCardIndex, votes = G.votes;

    const guessers = Object.keys(votes).filter(id => votes[id] === leaderCardIndex && getPlayer(id));
    const totalVoters = G.players.filter(p => p.id !== leader.id).length;

    const pointsGuess = {}; G.players.forEach(p => pointsGuess[p.id] = 0);
    const leaderGuessPoints = (guessers.length > 0 && guessers.length < totalVoters) ? 3 : 0;
    pointsGuess[leader.id] = leaderGuessPoints;
    G.players.forEach(p => { if (p.id !== leader.id && guessers.includes(p.id)) pointsGuess[p.id] = 3; });

    const pointsVotes = {}; G.players.forEach(p => pointsVotes[p.id] = 0);
    const playedCardsSnapshot = [...G.playedCards], votesSnapshot = {...votes};

    G.playedCards.forEach((item, idx) => {
      const ownerId = item.playerId;
      if (ownerId && ownerId.startsWith('bot_card_')) return;
      const owner = getPlayer(ownerId); if (!owner) return;
      let votesCount = 0;
      for (const voterId in votes){ if (votes[voterId] === idx && getPlayer(voterId)) votesCount++; }
      if (votesCount > 0) pointsVotes[ownerId] += votesCount;
    });
    if (guessers.length === totalVoters || guessers.length === 0) pointsVotes[leader.id] = 0;

    let reachedFinish = false;
    let finisher = null;
    G.players.forEach(p => {
      const total = pointsGuess[p.id] + pointsVotes[p.id];
      p.score += total;
      const rawPos = (p.position||0) + total;
      const finishedNow = rawPos >= TRACK_TOTAL;
      p._prevPos = p.position;
      p.position = finishedNow ? Math.min(rawPos, TRACK_TOTAL) : rawPos;
      p.pendingRawPos = rawPos;
      if (finishedNow){ reachedFinish = true; finisher = p; }
    });
    if (reachedFinish){
      G.awaitingContinueDecision = true;
      G.finishInfo = `${finisher.name} дошёл(-шла) до финиша с ${finisher.score} очками!`;
      G.finishInfoPlayerId = finisher.id;
    }

    G.lastResult = {
      mode:'standard', playedCards:playedCardsSnapshot, votes:votesSnapshot,
      pointsGuess:{...pointsGuess}, pointsVotes:{...pointsVotes}, guessers, leader,
      leaderCardIndex, totalVoters, reachedFinish, association:G.association, leaderCard:G.leaderCard,
    };

    G.playedCards.forEach(item => { if (item.card) G.discard.push(item.card); });
    G.playedCards = [];
    if (G.leaderCard){ G.discard.push(G.leaderCard); G.leaderCard = null; }

    G.phase = 'result';
    focusPlayer(HOST_ID);
    renderGame();
  }

  // TOAST, CONFIRM, ПРОСМОТРЩИК

  function toast(message, type){
    type = type || 'info';
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    document.getElementById('toastContainer').appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, 3200);
  }

  function showConfirm(message, onConfirm){
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmOverlay').classList.remove('hidden');
    const cleanup = () => {
      document.getElementById('confirmOverlay').classList.add('hidden');
      document.getElementById('confirmOkBtn').onclick = null;
      document.getElementById('confirmCancelBtn').onclick = null;
    };
    document.getElementById('confirmOkBtn').onclick = () => { cleanup(); onConfirm(); };
    document.getElementById('confirmCancelBtn').onclick = cleanup;
  }

  // ПРОСМОТРЩИК КАРТ
  let viewerCards = [];
  let viewerIndex = 0;

  // Инлайн-обработчики onclick в разметке карт выполняются в
  // ГЛОБАЛЬНОЙ области видимости (не внутри замыкания приложения), поэтому
  // локальные переменные вроде `active`/`cards` из функций рендера им
  // недоступны — раньше это и ломало открытие просмотрщика карт. Эти три
  // функции дают инлайн-обработчикам безопасный глобальный доступ к нужным
  // наборам карт в любой момент клика.
  window.getMyHandForViewer = function(){
    const active = getActivePlayer();
    return active ? active.cards : [];
  };
  window.getPlayedCardsForViewer = function(){
    return (G.playedCards || []).map(c => c.card);
  };
  window.getResultCardsForViewer = function(){
    return (G.lastResult && G.lastResult.playedCards) ? G.lastResult.playedCards.map(c => c.card) : [];
  };
  window.openCardViewer = function(cardsArray, startIndex) {
    if (!cardsArray || cardsArray.length === 0) return;
    viewerCards = cardsArray;
    viewerIndex = Math.min(startIndex, cardsArray.length-1);
    updateViewer();
    document.getElementById('cardViewer').classList.remove('hidden');
  };

  function updateViewer() {
    const card = viewerCards[viewerIndex];
    const container = document.getElementById('cardViewerImage');
    if (!card) return;
    if (card.img) {
      container.innerHTML = `<img src="${card.img}" alt="${escapeHtml(card.word || 'карта')}">`;
    } else {
      container.innerHTML = `<span style="font-size:4rem;">${card.emoji}</span><span style="font-size:2rem; margin-top:10px;">${escapeHtml(card.word)}</span>`;
    }
    document.getElementById('cardViewerCounter').textContent = `${viewerIndex+1} / ${viewerCards.length}`;
  }

  document.getElementById('cardViewerClose').addEventListener('click', () => {
    document.getElementById('cardViewer').classList.add('hidden');
  });
  document.getElementById('cardViewerPrev').addEventListener('click', () => {
    if (viewerCards.length === 0) return;
    viewerIndex = (viewerIndex - 1 + viewerCards.length) % viewerCards.length;
    updateViewer();
  });
  document.getElementById('cardViewerNext').addEventListener('click', () => {
    if (viewerCards.length === 0) return;
    viewerIndex = (viewerIndex + 1) % viewerCards.length;
    updateViewer();
  });
  let touchStartX = 0;
  const viewerEl = document.getElementById('cardViewer');
  viewerEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  viewerEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx < -50) document.getElementById('cardViewerNext').click();
    else if (dx > 50) document.getElementById('cardViewerPrev').click();
  }, { passive: true });

    let s = '';
    for (let i=0;i<len;i++) s += ROOM_CODE_CHARS[Math.floor(Math.random()*ROOM_CODE_CHARS.length)];

  function actuallyStartGame(){
    if (!G.selectedDeckIds || G.selectedDeckIds.length === 0){ toast('Выберите хотя бы одну колоду', 'warn'); return; }
    const poolSize = totalCardsInDecks(G.selectedDeckIds);
    const minNeeded = G.players.length * 6 + (G.players.length === 2 ? 1 : 0); // +1 — резерв на карту мамонта в режиме на двоих
    if (poolSize < minNeeded){
      toast(`В выбранных колодах ${poolSize} карт — на ${G.players.length} игроков нужно минимум ${minNeeded}. Выберите больше колод.`, 'warn');
      return;
    }
    closeDeckLobbyBrowser();
    G.myId = HOST_ID; G.isHost = true;
    const count = G.players.length;
    G.gameMode = count === 2 ? '2' : count === 3 ? '3' : '4plus';
    G.gameStarted = true;
    G.deck = shuffle(buildPoolFromDecks(G.selectedDeckIds, new Set())); G.discard = [];
    dealAllPlayers();
    G.players.forEach(p => { p.position = 0; p.score = 0; p._prevPos = 0; });
    G.turn = 1; G.currentLeaderIndex = 0; G.gameOver = false; G.stopReason = '';
    G.awaitingContinueDecision = false; G.finishInfo = null; G.finishInfoPlayerId = null;
    G.awaitingDeckDecision = false; G.deckDecisionInfo = null; G.deckDecisionAfterAction = null; G.deckSwitchPickerOpen = false;
    resetRoundState();
    G.mammothPosition = 0; G.commonSlonPosition = 0;
    G.animCommon = { from:0, to:0, progress:1 };
    G.animMammoth = { from:0, to:0, progress:1 };
    G.showField = false;
    if (G.fieldTimer) clearTimeout(G.fieldTimer);
    G.fieldTimer = null;
    focusPlayer(G.players[0].id);
    showScreen('screenGame');
    refreshRoleUI();
    renderGame();
    toast('Игра началась! Режим: ' + modeLabel(G.gameMode), 'success');
  }

  document.getElementById('addBotBtnGlobal').addEventListener('click', addBot);
  document.getElementById('clearBotsBtnGlobal').addEventListener('click', clearAllBots);

  document.getElementById('resetGameBtn').addEventListener('click', () => {
    if (!G.isRoomHost) return;
    showConfirm('Сбросить игру? Очки, позиции и карты обнулятся. Игроки останутся в комнате.', resetGameKeepPlayers);
  });

  document.getElementById('exitGameBtn').addEventListener('click', () => {
    if (G.isRoomHost){
      showConfirm('Выйти из игры? Комната закроется для всех, весь прогресс будет потерян.', fullResetToLanding);
    } else {
      showConfirm('Покинуть игру?', () => {
        sendAction('leave', {});
        stopNetworking();
        fullResetToLanding();
      });
    }
  });

  document.getElementById('viewFieldBtn').addEventListener('click', openManualFieldView);
  document.getElementById('fieldCloseBtn').addEventListener('click', closeManualFieldView);

  // ===================================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ===================================================================
  window.Game = Game;

  function initGameUI(){
    loadProfile();
    if (profile.name) {
      playerNameInput.value = profile.name;
    }

    let joinParam = null;
    try {
      const params = new URLSearchParams(location.search);
      joinParam = params.get('join');
    } catch(e){}

    // Предупреждение про недоступность Firebase больше не показываем здесь
    // заранее: раньше это само по себе означало, что Firebase начинает
    // грузиться сразу при открытии страницы — а значит, даже "Игра с
    // ботами" оказывалась в зависимости от того, доступен ли Firebase.
    // Теперь Firebase трогаем только по факту нажатия "Создать комнату"
    // или "Зайти в комнату" (см. ensureFirebaseInit) — офлайн-уведомление
    // показывается там же, если понадобится.

    if (joinParam) {
      // Переход по QR-ссылке: код комнаты уже известен, сразу переходим
      // к знакомству (имя и аватар), а подключение произойдёт после него.
      pendingFlow = 'join';
      pendingJoinCode = joinParam.toUpperCase();
      showScreen('screenIntro');
    } else if (!document.querySelector('.screen.active')) {
      showScreen('screenAction');
    }

    startAnimation();
  }

  // ВАЖНО: раньше вся стартовая инициализация экрана (профиль, нужный
  // начальный экран, обработка join-ссылки, запуск анимации) была привязана
  // к событию window 'load'. Событие 'load' наступает только когда ВСЕ
  // сетевые запросы страницы завершились — включая динамически добавленные
  // скрипты Firebase/QRCode. Если Firebase-домены заблокированы без явной
  // ошибки соединения (например, интернет без VPN у части провайдеров), это
  // могло надолго задерживать 'load', а вместе с ним — и весь этот блок,
  // из-за чего игра выглядела "зависшей"/нерабочей, хотя ни ботам, ни
  // локальной игре сеть не нужна. Наш script-тег стоит в самом конце
  // <body>, поэтому к моменту его выполнения DOM уже точно готов — ждать
  // 'load' незачем, можно запускать инициализацию сразу.
  initGameUI();

})();
</script>
</body>
</html>
